[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tokentrimmer"
version = "0.1.0"
description = "Thin wrapper around the OpenAI Python SDK that routes through TokenTrimmer Gateway."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "TokenTrimmer Contributors" }]
keywords = ["llm", "openai", "anthropic", "gateway", "cost-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# NOTE: the streaming usage-frame strip swaps the OpenAI stream's injectable SSE
# decoder (`stream._decoder` / `client._make_sse_decoder()`) and imports
# `openai._streaming.ServerSentEvent` (see tokentrimmer/client.py). Those
# internals don't exist / behave differently before this floor, where the strip
# silently no-ops and re-exposes the malformed-chunk crash. Built/tested against
# 1.70.0; keep the floor at the tested version.
dependencies = [
    "openai>=1.70.0,<3.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.22"]

[project.urls]
Homepage = "https://tokentrimmer.com"
Repository = "https://github.com/tokentrimmer/tokentrimmer"
Issues = "https://github.com/tokentrimmer/tokentrimmer/issues"
Documentation = "https://docs.tokentrimmer.com"

[tool.hatch.build.targets.wheel]
packages = ["tokentrimmer"]

[tool.hatch.build.targets.sdist]
include = ["tokentrimmer/", "README.md", "LICENSE", "pyproject.toml"]
