[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tokentrimmer"
version = "0.3.0"
description = "Thin wrapper around the OpenAI Python SDK that routes through TokenTrimmer Gateway."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "TokenTrimmer Contributors" }]
keywords = ["llm", "openai", "anthropic", "gateway", "cost-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# NOTE: the streaming usage-frame strip swaps the OpenAI stream's injectable SSE
# decoder (`stream._decoder` / `client._make_sse_decoder()`) and imports
# `openai._streaming.ServerSentEvent` (see tokentrimmer/client.py). Those
# internals don't exist / behave differently before this floor, where the strip
# silently no-ops and re-exposes the malformed-chunk crash. Keep the floor at
# the tested version. Ceiling: the 2.x line is verified compatible — the
# `openai._streaming` internals (ServerSentEvent, lazy `_decoder` wiring via
# `_make_sse_decoder()`, SSEBytesDecoder protocol) are unchanged in 2.x and the
# full suite passes against 1.109.1 and 2.41.1 (2026-06). Do NOT raise the
# ceiling past <3.0.0 without re-verifying those internals against 3.x.
dependencies = [
    "openai>=1.70.0,<3.0.0",
    "httpx>=0.27.0",
]

# Optional framework integrations. The BASE package must never hard-depend on
# these — `import tokentrimmer` works with none installed (guarded imports +
# lazy `__getattr__`). Install an extra only for the integration you use.
[project.optional-dependencies]
# LangChain cost callback (tokentrimmer.integrations.langchain). langchain-core
# is enough for the callback itself; langchain-openai is what surfaces the
# x-tokentrimmer-* response headers (include_response_headers=True) and is used
# by the make_gateway_chat_openai() convenience factory.
langchain = ["langchain-core>=0.3", "langchain-openai>=0.2"]
# LangGraph cost attribution. The LangChain callback (above) drives a LangGraph
# graph unchanged — pass it via graph.invoke(config={"callbacks": [cb]}). This
# extra just pulls in LangGraph (which itself runs on langchain-core's callback
# manager) so the same callback flows through the graph's nodes.
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
# LiteLLM cost logger (tokentrimmer.integrations.litellm). litellm is enough for
# the CustomLogger; the logger reads the x-tokentrimmer-* response headers LiteLLM
# surfaces when litellm.return_response_headers=True.
litellm = ["litellm>=1.40"]
# OpenTelemetry span recording. The integrations record cost attributes onto the
# current span when this is installed; without it, they still accumulate totals.
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
# CI installs ONLY this extra (see .github/workflows/sdks.yml), so it must pull in
# every dep the integration tests exercise: langchain-core + opentelemetry (the
# LangChain callback + span recording), langgraph (callback-propagation test), and
# litellm (the LiteLLM logger tests, incl. the respx end-to-end round-trip). It
# omits langchain-openai (heavy, only exercised by an importorskip'd factory test).
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.22",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "litellm>=1.40",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.urls]
Homepage = "https://tokentrimmer.com"
Repository = "https://github.com/tokentrimmer/tokentrimmer"
Issues = "https://github.com/tokentrimmer/tokentrimmer/issues"
Documentation = "https://docs.tokentrimmer.com"

[tool.hatch.build.targets.wheel]
packages = ["tokentrimmer"]

[tool.hatch.build.targets.sdist]
include = ["tokentrimmer/", "README.md", "LICENSE", "pyproject.toml"]
