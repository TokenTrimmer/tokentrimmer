[package]
name = "tt-provider-openai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenAI provider adapter — chat completions, embeddings, streaming."

[dependencies]
tt-shared.workspace = true
tt-provider-compat.workspace = true
async-trait.workspace = true
# `multipart` is enabled here (not in the workspace reqwest) because only the
# Batch input-file upload needs it; the rest of the adapter uses JSON bodies.
reqwest = { workspace = true, features = ["multipart"] }
futures.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true

[dev-dependencies]
httpmock.workspace = true
insta.workspace = true
tokio.workspace = true
serde_json.workspace = true
tokio-test.workspace = true
rstest.workspace = true
uuid.workspace = true

[lints]
workspace = true
