[package]
name = "tt-preview"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cost preview engine — projects cost + savings + route suggestions for an LLM request without calling any model."

[dependencies]
tt-shared.workspace = true
tt-provider-openai.workspace = true
tt-provider-anthropic.workspace = true
tt-provider-gemini.workspace = true
tt-provider-groq.workspace = true
tt-provider-mistral.workspace = true
tt-provider-together.workspace = true
tt-provider-openrouter.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tt-tokenize.workspace = true
tokio = { workspace = true, features = ["sync"] }
uuid.workspace = true
# Header-only base64 decode for reading inline image dims from `data:` URLs
# (PNG IHDR / JPEG SOF) — NOT a full image-decode crate.
base64 = "0.22"

[dev-dependencies]
httpmock = "0.8.3"
insta = { version = "1.39", features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
