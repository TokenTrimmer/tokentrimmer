[package]
name = "tt-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol server exposing TokenTrimmer intelligence to MCP-compatible clients."

[dependencies]
tt-shared.workspace = true
tt-auth.workspace = true
tt-context.workspace = true
tt-inspect-core.workspace = true
tt-inspect-rules-tier1.workspace = true
tt-plan-core.workspace = true
tt-routing.workspace = true
tt-preview = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Query-offload (`run_query` / `list_datasets`): bounded file/SQL execution.
sqlx.workspace = true
sqlparser.workspace = true
csv.workspace = true
blake3.workspace = true
chrono.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync"] }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tempfile = { workspace = true }
url = { workspace = true }
axum = { workspace = true, features = ["macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }

[features]
default = ["preview"]
preview = ["dep:tt-preview"]

[dev-dependencies]
httpmock = { workspace = true }
insta = { workspace = true, features = ["json"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
# Used only by auth tests to mint a real argon2-hashed key into the in-memory
# key store (via `tt_auth::issue`), so verification exercises the real crypto
# path rather than a reimplemented hash.
tt-telemetry.workspace = true
uuid.workspace = true
chrono.workspace = true

[lints]
workspace = true
