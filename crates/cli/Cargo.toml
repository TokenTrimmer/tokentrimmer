[package]
name = "tt-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `tt` CLI binary — gateway, inspect, plan, audit subcommands."

[[bin]]
name = "tt"
path = "src/main.rs"

[lib]
name = "tt_cli"
path = "src/lib.rs"

[dependencies]
tt-shared.workspace = true
tt-core.workspace = true
tt-retrieval.workspace = true
tt-cache.workspace = true
tt-routing = { workspace = true, features = ["postgres"] }
tt-auth = { workspace = true, features = ["postgres"] }
tt-telemetry = { workspace = true, features = ["postgres"] }
tt-config.workspace = true
sqlx.workspace = true
tt-inspect-core.workspace = true
tt-inspect-rules-tier1.workspace = true
tt-plan-core.workspace = true
tt-preview.workspace = true
tt-mcp.workspace = true
tt-tokenize.workspace = true
tt-client.workspace = true
reqwest.workspace = true
regex.workspace = true
percent-encoding.workspace = true

axum.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
sentry.workspace = true
tera.workspace = true
include_dir.workspace = true
walkdir.workspace = true
sha2.workspace = true
dialoguer.workspace = true
toml.workspace = true
chrono.workspace = true
rustls.workspace = true
crossterm = "0.29"
console = "0.15"
comfy-table = { version = "7", features = ["custom_styling"] }
indicatif = "0.17"
rustyline = "14"
dirs = "6.0"
base64 = "0.22"
tempfile.workspace = true
bytes.workspace = true
uuid.workspace = true

[dev-dependencies]
httpmock.workspace = true
insta = { workspace = true }

[lints]
workspace = true
