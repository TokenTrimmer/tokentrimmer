[package]
name = "tt-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `tt` CLI binary — gateway, inspect, plan, audit subcommands."

[[bin]]
name = "tt"
path = "src/main.rs"

[lib]
name = "tt_cli"
path = "src/lib.rs"

[dependencies]
tt-shared.workspace = true
tt-core.workspace = true
tt-retrieval = { workspace = true, features = ["postgres"] }
tt-cache.workspace = true
tt-routing = { workspace = true, features = ["postgres"] }
tt-auth = { workspace = true, features = ["postgres"] }
tt-telemetry = { workspace = true, features = ["postgres"] }
tt-config.workspace = true
sqlx.workspace = true
tt-inspect-core.workspace = true
tt-inspect-rules-tier1.workspace = true
tt-plan-core.workspace = true
tt-preview.workspace = true
tt-context.workspace = true
tt-mcp.workspace = true
tt-tokenize.workspace = true
tt-client.workspace = true
# The doc-sidecar lib (the in-process extraction engine `tt docprep` reuses
# client-side — the same PDF-text-layer + OCR code the gateway seam calls over
# HTTP). Off-by-default OCR feature keeps the CLI build lean.
doc-sidecar = { path = "../doc-sidecar" }
reqwest.workspace = true
regex.workspace = true
percent-encoding.workspace = true

axum.workspace = true
clap.workspace = true
# Shell-completion + man-page generation for the hidden `tt completions`/`tt man`
# subcommands. Both track clap's major version (clap 4 → clap_complete 4.x,
# clap_mangen 0.2.x); not in [workspace.dependencies] since tt-cli is the only
# consumer.
clap_complete = "4"
clap_mangen = "0.2"
tokio.workspace = true
futures.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
sentry.workspace = true
tera.workspace = true
include_dir.workspace = true
walkdir.workspace = true
sha2.workspace = true
dialoguer.workspace = true
toml.workspace = true
chrono.workspace = true
rustls.workspace = true
crossterm = "0.29"
console = "0.16.3"
comfy-table = { version = "7", features = ["custom_styling"] }
indicatif = "0.18.4"
rustyline = { version = "18", default-features = false, features = ["custom-bindings", "with-dirs"] }
dirs = "6.0"
base64 = "0.22"
tempfile.workspace = true
bytes.workspace = true
uuid.workspace = true

[dev-dependencies]
httpmock.workspace = true
insta = { workspace = true }
# Integration tests mint a real signed audit chain (via
# `tt_cli::local_audit::append_entry`) to exercise the `--attestation` bundle
# path end-to-end; that helper takes a `uuid::Uuid` org id.
uuid.workspace = true

[lints]
workspace = true
