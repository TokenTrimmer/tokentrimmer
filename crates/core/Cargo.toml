[package]
name = "tt-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Axum HTTP server, routing engine, middleware, and provider registry."

[features]
# Phase-2b learned-compression scorer (OFF by default — the public/Fly builds
# stay ML-dep-free; only the owner's M4 Max gateway build enables this).
ml-scoring = ["dep:tt-ml-scoring"]
contract-schema = ["dep:schemars", "tt-routing/contract-schema"]

[dependencies]
tt-shared.workspace = true
tt-tokenize.workspace = true
tt-cache.workspace = true
tt-retrieval = { workspace = true, features = ["postgres"] }
tt-preview.workspace = true
# Header-only base64 decode of inline image bytes for the document-lane seam's
# vision-avoided saving projection (D4c-v2). Same version the preview crate uses.
base64 = "0.22"
# Gateway-tool executor (routes/gateway_tools.rs): the `inspect_diff` read-only
# tool scans a proposed diff via inspect-core + the Tier-1 rule set, ported from
# the MCP tool so the agent loop can run it inline (no core->mcp cycle).
tt-inspect-core.workspace = true
tt-inspect-rules-tier1.workspace = true
# Reuse the plan-replay quality judge (JudgeProvider/RiskBand/SampleScore) for
# the live sampled judge on rerouted traffic (quality_sample.rs).
tt-plan-core.workspace = true
tt-routing.workspace = true
tt-auth.workspace = true
tt-telemetry.workspace = true
tt-config.workspace = true
tt-provider-openai.workspace = true
tt-provider-azure.workspace = true
tt-provider-anthropic.workspace = true
tt-provider-gemini.workspace = true
tt-provider-mistral.workspace = true
tt-provider-groq.workspace = true
tt-provider-together.workspace = true
tt-provider-openrouter.workspace = true
tt-provider-local.workspace = true

sqlx.workspace = true
blake3.workspace = true
# Workflow secret cipher (W3b Task 1): XChaCha20-Poly1305 encryption + SHA-256
# KDF for the per-org encrypted secret store (workflow/secrets.rs).
chacha20poly1305.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
# Redaction guardrail (passes/redaction.rs) — secret/PII pattern matching,
# ported from the Tier-1 inspect secret rule plus email/SSN matchers.
regex.workspace = true
dashmap.workspace = true
rand_core.workspace = true
# Pre-auth per-IP rate cap in front of the argon2 key-verify path
# (middleware/argon2_cap.rs). GCRA keyed limiter.
governor.workspace = true

metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# `multipart` enables `axum::extract::Multipart` for the Batch Lane file-upload
# endpoint (`POST /v1/files`, routes/batches.rs).
axum = { workspace = true, features = ["multipart"] }
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
# W3C `traceparent` ingest: extract an inbound trace context from request
# headers and continue that trace at the request-span layer
# (middleware/trace.rs).
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
# Re-encodes the chat SSE stream into Anthropic SSE frames on /v1/messages (routes/messages.rs).
async-stream.workspace = true
# Zeroizing wrapper for the plaintext retrieval-prompt clone (middleware/retrieval.rs).
zeroize.workspace = true
# `inspect_diff` gateway tool writes proposed content to a temp file to scan it
# (routes/gateway_tools.rs), mirroring the MCP tool.
tempfile.workspace = true
# Guarded outbound HTTP client for workflow Http nodes (W3b Task 3).
reqwest.workspace = true
# Phase-2b learned-compression scorer (optional, behind `ml-scoring`).
tt-ml-scoring = { workspace = true, optional = true }

[dev-dependencies]
argon2.workspace = true
criterion.workspace = true
# `test-util` enables `#[tokio::test(start_paused = true)]` for the judge
# deadline/timeout tests (paused time — no real waiting). Dev-only.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true }
serde_json.workspace = true
httpmock.workspace = true
tt-retrieval.workspace = true
# DB-gated migrations test: drive a real PostgresRequestLogWriter INSERT
# against the migrated schema (catches column-order/type drift that the
# parser-based bind-count guard cannot).
tt-telemetry = { workspace = true, features = ["postgres"] }
# DB-gated route_pauses test: drive the real PostgresRoutingStore
# pause/resume SQL against the migrated schema (the test creates the minimal
# cloud-shaped `routes` table itself — public migrations don't own it).
tt-routing = { workspace = true, features = ["postgres"] }
reqwest.workspace = true
# Traceparent-ingest test: in-memory span exporter + a scoped tracing-opentelemetry
# subscriber to capture the gateway request span's trace_id/parent_span_id.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber.workspace = true

[[bench]]
name = "streaming"
harness = false

[lints]
workspace = true
