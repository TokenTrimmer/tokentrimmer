[package]
name = "tt-telemetry"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenTelemetry setup + audit log primitives (hash-chain + Ed25519 signatures)."

[dependencies]
tt-shared.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
async-trait.workspace = true
hex.workspace = true
rand_core.workspace = true

# Optional — gated behind `postgres` so OSS distributions that don't run
# the request-log writer stay sqlx-free.
sqlx = { workspace = true, optional = true }

[features]
default = []
postgres = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
