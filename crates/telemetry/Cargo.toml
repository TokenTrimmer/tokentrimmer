[package]
name = "tt-telemetry"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenTelemetry setup + audit log primitives (hash-chain + Ed25519 signatures)."

[dependencies]
tt-shared.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
async-trait.workspace = true
hex.workspace = true
rand_core.workspace = true
chacha20poly1305.workspace = true
# `write_with_retry` backs off between transient-failure retries with
# `tokio::time::sleep`; only the `time` feature is needed here.
tokio = { workspace = true, features = ["time"] }

# Optional — gated behind `postgres` so OSS distributions that don't run
# the request-log writer stay sqlx-free.
sqlx = { workspace = true, optional = true }

[features]
default = []
postgres = ["dep:sqlx"]
contract-schema = ["dep:schemars"]

[dev-dependencies]
tokio = { workspace = true }
# gen_ai span-attribute unit tests: capture the recorded attributes via an
# in-memory span exporter under a scoped tracing-opentelemetry subscriber.
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
