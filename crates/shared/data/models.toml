# ── Anthropic ───────────────────────────────────────────────────────────────
# Context windows + max-output verified against platform.claude.com model docs.
# claude-haiku-4-5: 200K context, 64K max output. Sonnet 4.6 and the Opus 4.x
# flagships carry a 1M-token context window at standard pricing and 128K max
# output (Sonnet 4.6 caps at 64K). The prior 200K/8192 entries were stale.
[[model]]
provider = "anthropic"
model = "claude-haiku-4-5"
max_input_tokens = 200000
max_output_tokens = 65536
capabilities = ["text", "vision", "tools", "json_mode", "streaming", "prompt_caching"]

