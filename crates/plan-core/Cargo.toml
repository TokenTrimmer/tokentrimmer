[package]
name = "tt-plan-core"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plan replay engine — deterministic simulation with bootstrap confidence intervals."

[dependencies]
tt-shared.workspace = true
tt-telemetry.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
# DETERMINISM PIN (TEST-7): the bootstrap-CI resampling behind signed savings
# attestations is reproducible only as long as the RNG value stream is stable.
# `rand_chacha` provides the seeded ChaCha8 stream and `rand`'s `gen_range`
# provides the index distribution — BOTH feed `bootstrap::bootstrap_ci`, so both
# are EXACT-pinned. A rand-family bump can silently shift the resampled values
# (rand 0.9's Uniform already broke value-stability once). Bumping either crate
# is therefore a DELIBERATE act that requires regenerating the attested goldens
# (the `tests/replay.rs` insta snapshot + the `tests/bootstrap.rs` value pin) and
# re-attesting — never an incidental `cargo update`. See the RNG-reproducibility
# constraint in the repo memory.
rand = "=0.8.6"
rand_chacha = "=0.3.1"

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
# Dev-only: the RouteConditions/RouteAction cross-type wire-compat guards
# round-trip the real gateway types. No cycle — tt-routing does not depend on
# tt-plan-core.
tt-routing.workspace = true

[lints]
workspace = true
