[package]
name = "tt-auth"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "API key validation. Web auth (Auth.js) lives in the cloud repo, not here."

[dependencies]
tt-shared.workspace = true
tt-telemetry.workspace = true
argon2.workspace = true
async-trait.workspace = true
chrono.workspace = true
hex.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

# Optional — gated behind the `postgres` feature so OSS distributions that
# don't need a DB-backed credential store stay lean.
sqlx = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = []
postgres = ["dep:sqlx", "dep:chacha20poly1305", "dep:sha2"]

[dev-dependencies]
tokio = { workspace = true }
chrono.workspace = true

[lints]
workspace = true
