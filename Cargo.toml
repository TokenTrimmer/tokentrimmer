[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/core",
    "crates/cache",
    "crates/preview",
    "crates/routing",
    "crates/auth",
    "crates/telemetry",
    "crates/config",
    "crates/inspect-core",
    "crates/inspect-rules-tier1",
    "crates/plan-core",
    "crates/cli",
    "crates/mcp",
    "crates/ts-types",
    "crates/tokenize",
    "crates/client",
    "crates/providers/compat",
    "crates/providers/openai",
    "crates/providers/azure",
    "crates/providers/anthropic",
    "crates/providers/gemini",
    "crates/providers/mistral",
    "crates/providers/groq",
    "crates/providers/together",
    "crates/providers/openrouter",
    "crates/providers/local",
    "crates/retrieval",
    "crates/context",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/tokentrimmer/tokentrimmer"
authors = ["TokenTrimmer Contributors"]

[workspace.dependencies]
# Async runtime + HTTP
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
hyper = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
# Direct dep ONLY so binaries can install an explicit process-default
# CryptoProvider: the tree now links BOTH ring (reqwest 0.12 et al) and
# aws-lc-rs (redis 1.x / opentelemetry-otlp 0.32), and rustls panics at first
# default-provider use when more than one is linked (took prod down on the
# 2026-06-12 deploy of #158 — the OTLP exporter's reqwest 0.13 client hit it
# at boot). default-features = false so this declaration itself doesn't pull
# aws-lc-rs a second way.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
# Streaming CSV reader for the MCP query-offload file executor (no rand in its
# dependency graph; Unlicense OR MIT).
csv = "1.4"

# SQL parsing — the allowlist gate for the MCP `run_query` tool's Postgres
# surface (exactly-one-SELECT + escape-function denylist). `visitor` enables
# whole-AST traversal so denylisted functions are caught in CTEs/subqueries.
# Apache-2.0; no rand in its dependency graph.
sqlparser = { version = "0.62", features = ["visitor"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# Error handling + tracing
thiserror = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
# OTLP span exporter. HTTP/protobuf transport over reqwest-rustls so the export
# path stays on a rustls TLS stack (no native-TLS or tonic-transport TLS
# stack; reqwest 0.13's `default-tls` is rustls). Note: with 0.32's default
# features opentelemetry-proto pulls in only prost for its generated wire
# types — tonic is not in the dependency tree at all.
#
# `reqwest-blocking-client` (the 0.32 default HTTP client) rather than the
# async `reqwest-client`: since opentelemetry_sdk 0.30 the batch span
# processor runs on its own dedicated thread (the tokio-runtime processor is
# now experimental), and the async client cannot be driven from that thread.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
# `HeaderExtractor` adapter so the gateway can extract an inbound W3C
# `traceparent` from request headers (crates/core/src/middleware/trace.rs).
# Already in the tree transitively via opentelemetry-otlp; pinned here so the
# direct use is explicit.
opentelemetry-http = "0.32"

# Crypto + auth
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
zeroize = "1.8"
rand_core = { version = "0.6", features = ["getrandom"] }

# DB + cache
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "chrono", "json"] }
redis = { version = "1.2", features = ["tokio-rustls-comp", "connection-manager"] }
pgvector = { version = "0.4", features = ["sqlx"] }
dashmap = "6"
# Pre-auth per-IP rate limiting on the gateway's argon2 key-verify path
# (GCRA keyed limiter). Same version the cloud tt-api uses for its abuse-control
# limiter so both halves of the cross-repo rate-limit item stay in lockstep.
governor = "0.10"

# Parallelism
rayon = "1.10"

# Streaming + utilities
futures = "0.3"
async-stream = "0.3"
bytes = "1.7"
uuid = { version = "1.23", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"

# Tests
insta = { version = "1.40", features = ["json", "yaml", "redactions"] }
httpmock = "0.8.3"
tokio-test = "0.4"
rstest = "0.26"
tempfile = "3"
criterion = { version = "0.8", default-features = false }

percent-encoding = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Observability — rustls transport so we match the workspace TLS choice.
sentry = { version = "0.48.2", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

# Static analysis (Inspect)
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
walkdir = "2"
regex = "1"
tiktoken-rs = "0.12"

# tt init installer
tera = "1.20"
include_dir = { version = "0.7", features = ["glob"] }
dialoguer = "0.12"
toml = "0.8"

# Internal crate refs.
# Every entry carries `version` alongside `path` so `cargo publish` can rewrite
# the path deps into registry deps (required for the release-crates workflow).
tt-shared = { path = "crates/shared", version = "0.1" }
tt-tokenize = { path = "crates/tokenize", version = "0.1" }
# Package renamed on crates.io (the name `tt-client` is owned by an unrelated
# third party); the alias keeps every consumer's `tt-client.workspace = true`
# and all `use tt_client::` imports unchanged.
tt-client = { package = "tokentrimmer-client", path = "crates/client", version = "0.1" }
tt-core = { path = "crates/core", version = "0.1" }
tt-cache = { path = "crates/cache", version = "0.1" }
tt-routing = { path = "crates/routing", version = "0.1" }
tt-auth = { path = "crates/auth", version = "0.1" }
tt-telemetry = { path = "crates/telemetry", version = "0.1" }
tt-config = { path = "crates/config", version = "0.1" }
tt-inspect-core = { path = "crates/inspect-core", version = "0.1" }
tt-inspect-rules-tier1 = { path = "crates/inspect-rules-tier1", version = "0.1" }
tt-plan-core = { path = "crates/plan-core", version = "0.1" }
tt-provider-compat = { path = "crates/providers/compat", version = "0.1" }
tt-provider-openai = { path = "crates/providers/openai", version = "0.1" }
tt-provider-azure = { path = "crates/providers/azure", version = "0.1" }
tt-provider-anthropic = { path = "crates/providers/anthropic", version = "0.1" }
tt-provider-gemini = { path = "crates/providers/gemini", version = "0.1" }
tt-provider-mistral = { path = "crates/providers/mistral", version = "0.1" }
tt-provider-groq = { path = "crates/providers/groq", version = "0.1" }
tt-provider-together = { path = "crates/providers/together", version = "0.1" }
tt-provider-openrouter = { path = "crates/providers/openrouter", version = "0.1" }
tt-provider-local = { path = "crates/providers/local", version = "0.1" }
tt-preview = { path = "crates/preview", version = "0.1" }
tt-mcp = { path = "crates/mcp", version = "0.1" }
tt-retrieval = { path = "crates/retrieval", version = "0.1" }
tt-context = { path = "crates/context", version = "0.1" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
uninlined_format_args = "deny"
