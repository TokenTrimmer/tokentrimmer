# cargo-deny configuration — license allowlist enforced in CI.
# We are Apache-2.0; only compatible licenses allowed in the OSS workspace.

[graph]
all-features = false

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    # Permissive (data) license carried by transitive deps (e.g. webpki-roots
    # cert data); Apache-2.0 compatible.
    "CDLA-Permissive-2.0",
    # University of Illinois/NCSA Open Source License — OSI-approved + FSF-free,
    # a permissive BSD/MIT-style license. Carried by `libfuzzer-sys` (a fuzz-only
    # dep of `rav1e`, pulled transitively by `image`'s AVIF support in the
    # out-of-process doc-sidecar); Apache-2.0/MIT compatible.
    "NCSA",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Every wildcard dependency in this tree is an internal `tt-*` crate depended
# on by path with `version = "*"`. `allow-wildcard-paths` does NOT exempt them
# (cargo-deny treats publishable crates' path deps as disallowed regardless),
# so allow wildcards outright — there are no external `*` deps to guard against.
wildcards = "allow"
highlight = "all"

[advisories]
yanked = "deny"
# AUDIT POLICY: re-audit this entire ignore list every release. Each entry below
# carries an inline annotation recording (a) why it's ignored, (b) the upstream
# blocker preventing a fix, and (c) a re-check date. Next scheduled re-check for
# all entries: 2026-09-15 (~3 months out). Do not add an entry without these.
ignore = [
    # --- spin 0.9.8 yanked ---------------------------------------------------
    # `spin` 0.9.8 is pulled by axum -> multer 3.1.0, whose current release and
    # upstream branch constrain `spin` to the 0.9 line. It has been yanked but
    # has no RustSec advisory, and no non-yanked 0.9.x replacement exists.
    # Owner: Security/Dependencies. Keep the global yanked policy at deny and
    # exempt this exact version only; remove the exemption when multer releases
    # support for spin >= 0.10. Re-check 2026-08-19.
    { crate = "spin@0.9.8", reason = "transitive via axum -> multer; no non-yanked 0.9.x exists; re-check 2026-08-19" },
    # --- ttf-parser unmaintained ----------------------------------------------
    # `ttf-parser` (font-table parsing) — unmaintained but NOT vulnerable. Pulled
    # transitively by the doc-sidecar's pure-Rust PDF text extractor
    # (pdf-extract -> lopdf -> ttf-parser) for correct glyph->text mapping. The
    # sidecar is an out-of-process operational binary; not on the gateway hot
    # path. Owner: Document Lane. Blocker: lopdf must migrate off ttf-parser.
    # Re-check 2026-09-15.
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (not vuln); blocker: lopdf transitive (doc-sidecar); re-check 2026-09-15
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
