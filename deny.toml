# cargo-deny configuration — license allowlist enforced in CI.
# We are Apache-2.0; only compatible licenses allowed in the OSS workspace.

[graph]
all-features = false

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    # Permissive (data) license carried by transitive deps (e.g. webpki-roots
    # cert data); Apache-2.0 compatible.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Every wildcard dependency in this tree is an internal `tt-*` crate depended
# on by path with `version = "*"`. `allow-wildcard-paths` does NOT exempt them
# (cargo-deny treats publishable crates' path deps as disallowed regardless),
# so allow wildcards outright — there are no external `*` deps to guard against.
wildcards = "allow"
highlight = "all"

[advisories]
yanked = "deny"
# AUDIT POLICY: re-audit this entire ignore list every release. Each entry below
# carries an inline annotation recording (a) why it's ignored, (b) the upstream
# blocker preventing a fix, and (c) a re-check date. Next scheduled re-check for
# all entries: 2026-09-15 (~3 months out). Do not add an entry without these.
ignore = [
    # --- rustls-webpki cert/CRL parsing panics --------------------------------
    # All four are transitive via sentry -> rustls 0.22, which pins
    # rustls-webpki to the 0.102.x line; the fixes only exist on >= 0.103.x,
    # unreachable without a sentry/rustls major bump (the separate, larger
    # sentry -> rustls 0.23 task). Low impact for us: an HTTPS *client* to a
    # trusted Sentry endpoint, not a TLS server validating attacker-controlled
    # certs/CRLs.
    "RUSTSEC-2026-0104", # rustls-webpki panic; blocker: sentry->rustls 0.22; re-check 2026-09-15
    "RUSTSEC-2026-0099", # rustls-webpki panic; blocker: sentry->rustls 0.22; re-check 2026-09-15
    "RUSTSEC-2026-0098", # rustls-webpki panic; blocker: sentry->rustls 0.22; re-check 2026-09-15
    "RUSTSEC-2026-0049", # rustls-webpki panic; blocker: sentry->rustls 0.22; re-check 2026-09-15
    # --- rsa "Marvin" timing side-channel -------------------------------------
    # No patched version of `rsa` exists; pulled transitively only by sqlx's
    # MySQL auth path, and we use Postgres exclusively (the vulnerable code is
    # never reached). Blocker: upstream `rsa` has no fix; would otherwise need
    # sqlx to drop the dependency.
    "RUSTSEC-2023-0071", # rsa Marvin timing side-channel; blocker: no upstream fix (sqlx mysql, unused); re-check 2026-09-15
    # --- async-std unmaintained -----------------------------------------------
    # Unmaintained transitive dep with no adopted replacement yet (newer
    # cargo-deny flags unmaintained crates as errors). Not a memory-safety
    # advisory. Blocker: a transitive dep must migrate off async-std.
    "RUSTSEC-2025-0052", # async-std unmaintained (not vuln); blocker: transitive dep migration; re-check 2026-09-15
    # --- number_prefix unmaintained -------------------------------------------
    # `number_prefix` (k/M/G number formatting) — unmaintained but NOT
    # vulnerable. Tiny, stable, single-purpose crate pulled transitively by
    # `indicatif` (tt-cli's spinner/progress UI). Blocker: revisit when
    # indicatif drops it.
    "RUSTSEC-2025-0119", # number_prefix unmaintained (not vuln); blocker: indicatif transitive; re-check 2026-09-15
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
