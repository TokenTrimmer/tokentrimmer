name: shellcheck

# Lints the bash tooling in scripts/ on any change to it. Gated at WARNING
# severity: the existing scripts are clean at this level, while info/style
# notes (e.g. intentional single-quoted literals) are not failed on.

on:
  pull_request:
    paths:
      - 'scripts/*.sh'
      - 'scripts/benchmarks/**/*.sh'
      - '.github/workflows/shellcheck.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*.sh'
      - 'scripts/benchmarks/**/*.sh'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint scripts (severity=warning)
        # -x lets shellcheck follow the `source`d benchmark lib.sh.
        run: shellcheck -x --severity=warning scripts/*.sh scripts/benchmarks/*.sh scripts/benchmarks/litellm/*.sh
