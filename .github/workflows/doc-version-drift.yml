name: Doc version drift

# Asserts that GETTING_STARTED.md contains the exact openai version strings
# pinned in sdk-python/pyproject.toml and sdk-typescript/package.json.
# Fails loudly if the doc drifts from the manifests so broken install
# instructions can't reach users. Pure grep/parse — no build needed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: GETTING_STARTED openai versions vs manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check doc version drift
        run: bash scripts/check-doc-versions.sh
