name: Pricing drift

# Monthly drift check: reconcile the embedded price catalog
# (crates/shared/data/pricing.toml) against live provider list prices via
# scripts/refresh-pricing.py. The job FAILS when drift is detected (exit 1) so
# the scheduled-run failure notifies maintainers to review + append a dated
# entry. It never edits the catalog — pricing is billing-critical and stays
# human-gated. Also runnable on demand.

on:
  schedule:
    - cron: '0 9 1 * *' # 09:00 UTC on the 1st of each month
  workflow_dispatch:
  # Also sanity-check the script + catalog parse on PRs that touch either.
  pull_request:
    paths:
      - 'scripts/refresh-pricing.py'
      - 'crates/shared/data/pricing.toml'

permissions:
  contents: read

jobs:
  drift:
    name: catalog vs live provider pricing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12' # tomllib needs >=3.11
      - name: Detect pricing drift
        run: python3 scripts/refresh-pricing.py
