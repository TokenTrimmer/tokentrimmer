name: inspect-self (dogfood)

# Required check — the 21 Tier-1 rules ship and the repo self-scans clean.
# Any new HIGH or CRITICAL finding blocks merge to main.

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  inspect:
    name: tt inspect .
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build CLI
        run: cargo build -p tt-cli --release
      - name: Run Inspect on self (gate at HIGH severity)
        run: ./target/release/tt inspect . --fail-on=high
