name: inspect-self (dogfood)

# Required check — the 21 Tier-1 rules ship and the repo self-scans clean.
# Any new HIGH or CRITICAL finding blocks merge to main.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  inspect:
    name: tt inspect .
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build CLI
        run: cargo build -p tt-cli --release
      - name: Run Inspect on self (gate at HIGH severity)
        run: ./target/release/tt inspect . --fail-on=high
