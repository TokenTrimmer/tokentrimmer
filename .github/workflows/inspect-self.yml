name: inspect-self (dogfood)

# Required check — the 21 Tier-1 rules ship and the repo self-scans clean.
# Any new HIGH or CRITICAL finding blocks merge to main.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  inspect:
    name: tt inspect .
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build CLI
        run: cargo build -p tt-cli --release
      - name: Run Inspect on self (gate at HIGH severity)
        run: ./target/release/tt inspect . --fail-on=high
