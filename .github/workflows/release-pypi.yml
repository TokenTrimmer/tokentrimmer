# Publishes the `tokentrimmer` Python SDK (sdk-python/) to PyPI.
#
# Trigger: push a tag like `py-v0.1.0` (tag version must match
# sdk-python/pyproject.toml `version`).
#
# Auth: PyPI Trusted Publishing (OIDC) — no API token secret needed.
# One-time setup on pypi.org for the `tokentrimmer` project:
#   owner: TokenTrimmer, repo: tokentrimmer,
#   workflow: release-pypi.yml, environment: pypi
name: release-pypi

on:
  push:
    tags:
      - 'py-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Required for PyPI Trusted Publishing (OIDC token exchange).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify tag matches pyproject.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#py-v}"
          manifest_version="$(python -c 'import tomllib; print(tomllib.load(open("sdk-python/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match sdk-python/pyproject.toml version ${manifest_version}"
            exit 1
          fi
          echo "ok: tag ${GITHUB_REF_NAME} matches pyproject.toml version ${manifest_version}"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build --outdir dist sdk-python
      - name: Check py.typed shipped
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "tokentrimmer/py.typed" in names, f"py.typed missing from {wheel}: {names}"
          print(f"ok: tokentrimmer/py.typed present in {wheel}")
          EOF
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
