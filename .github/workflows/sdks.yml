name: sdks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.16'
          python-version: '3.11'
          working-directory: sdk-python
          enable-cache: true
      - name: Install
        run: uv sync --directory sdk-python --locked --extra test
      - name: Compile examples
        run: uv run --project sdk-python --locked python -m py_compile examples/python/*.py
      - name: Test
        run: uv run --directory sdk-python --locked python -m pytest tests/ -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install
        run: cd sdk-typescript && npm install
      - name: Typecheck SDK (src + tests)
        run: cd sdk-typescript && npm run typecheck
      - name: Test
        run: cd sdk-typescript && npx vitest run
      - name: Typecheck examples
        run: cd examples/typescript && ../../sdk-typescript/node_modules/.bin/tsc -p tsconfig.json

  n8n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install
        # --ignore-scripts: n8n-workflow's transitive isolated-vm fails its native
        # node-gyp build on runners, and nothing in typecheck/build/test needs it.
        run: cd n8n-nodes-tokentrimmer && npm install --ignore-scripts
      - name: Typecheck (src + tests)
        run: cd n8n-nodes-tokentrimmer && npm run typecheck
      - name: Build
        run: cd n8n-nodes-tokentrimmer && npm run build
      - name: Test
        run: cd n8n-nodes-tokentrimmer && npx vitest run

  rust-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Build example
        run: cargo build -p tokentrimmer-client --example cost_attribution
