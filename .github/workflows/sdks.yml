name: sdks

on:
  pull_request:
    paths:
      - 'sdk-python/**'
      - 'sdk-typescript/**'
      - 'n8n-nodes-tokentrimmer/**'
      - 'examples/**'
      - 'crates/client/**'
      - '.github/workflows/sdks.yml'
  push:
    branches: [main]
    paths:
      - 'sdk-python/**'
      - 'sdk-typescript/**'
      - 'n8n-nodes-tokentrimmer/**'
      - 'examples/**'
      - 'crates/client/**'
      - '.github/workflows/sdks.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e "sdk-python[test]"
      - name: Compile examples
        run: python -m py_compile examples/python/*.py
      - name: Test
        run: cd sdk-python && python -m pytest tests/ -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Install
        run: cd sdk-typescript && npm install
      - name: Typecheck SDK (src + tests)
        run: cd sdk-typescript && npm run typecheck
      - name: Test
        run: cd sdk-typescript && npx vitest run
      - name: Typecheck examples
        run: cd examples/typescript && ../../sdk-typescript/node_modules/.bin/tsc -p tsconfig.json

  n8n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Install
        # --ignore-scripts: n8n-workflow's transitive isolated-vm fails its native
        # node-gyp build on runners, and nothing in typecheck/build/test needs it.
        run: cd n8n-nodes-tokentrimmer && npm install --ignore-scripts
      - name: Typecheck (src + tests)
        run: cd n8n-nodes-tokentrimmer && npm run typecheck
      - name: Build
        run: cd n8n-nodes-tokentrimmer && npm run build
      - name: Test
        run: cd n8n-nodes-tokentrimmer && npx vitest run

  rust-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Build example
        run: cargo build -p tokentrimmer-client --example cost_attribution
