name: sdks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.16'
          python-version: '3.11'
          working-directory: sdk-python
          enable-cache: true
      - name: Install
        run: uv sync --directory sdk-python --locked --extra test
      - name: Compile examples
        run: uv run --project sdk-python --locked python -m py_compile examples/python/*.py
      - name: Test
        run: uv run --directory sdk-python --locked python -m pytest tests/ -q
      - name: Test clean-installed wheel (OpenAI floor and supported major lines)
        run: uv run --no-project python sdk-python/scripts/verify-installed.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install
        run: cd sdk-typescript && npm install
      - name: Typecheck SDK (src + tests)
        run: cd sdk-typescript && npm run typecheck
      - name: Test
        run: cd sdk-typescript && npx vitest run
      - name: Test clean-installed tarball and declarations (OpenAI floor and latest 6.x)
        run: cd sdk-typescript && npm run test:installed
      - name: Typecheck examples
        run: cd examples/typescript && ../../sdk-typescript/node_modules/.bin/tsc -p tsconfig.json

  n8n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install
        # --ignore-scripts: n8n-workflow's transitive isolated-vm fails its native
        # node-gyp build on runners, and nothing in typecheck/build/test needs it.
        run: cd n8n-nodes-tokentrimmer && npm install --ignore-scripts
      - name: Typecheck (src + tests)
        run: cd n8n-nodes-tokentrimmer && npm run typecheck
      - name: Build
        run: cd n8n-nodes-tokentrimmer && npm run build
      - name: Test
        run: cd n8n-nodes-tokentrimmer && npx vitest run

  rust-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Build example
        run: cargo build -p tokentrimmer-client --example cost_attribution
