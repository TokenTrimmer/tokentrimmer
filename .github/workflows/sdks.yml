name: sdks

on:
  pull_request:
    paths:
      - 'sdk-python/**'
      - 'sdk-typescript/**'
      - 'examples/**'
      - 'crates/client/**'
      - '.github/workflows/sdks.yml'
  push:
    branches: [main]
    paths:
      - 'sdk-python/**'
      - 'sdk-typescript/**'
      - 'examples/**'
      - 'crates/client/**'
      - '.github/workflows/sdks.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e "sdk-python[test]"
      - name: Compile examples
        run: python -m py_compile examples/python/*.py
      - name: Test
        run: cd sdk-python && python -m pytest tests/ -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Install
        run: cd sdk-typescript && npm install
      - name: Typecheck SDK (src + tests)
        run: cd sdk-typescript && npm run typecheck
      - name: Test
        run: cd sdk-typescript && npx vitest run
      - name: Typecheck examples
        run: cd examples/typescript && ../../sdk-typescript/node_modules/.bin/tsc -p tsconfig.json

  rust-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Build example
        run: cargo build -p tokentrimmer-client --example cost_attribution
