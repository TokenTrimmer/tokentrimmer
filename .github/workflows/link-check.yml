name: link-check

# Checks the Markdown docs and READMEs for broken links with lychee. The
# ignore-list in lychee.toml allows the not-yet-live hosted endpoints
# (api/dashboard.tokentrimmer.com) and local/placeholder URLs in code snippets,
# so this job is green today while still catching genuinely broken links.

on:
  workflow_dispatch:
  # Weekly run catches links that rot after merge (external sites going away).
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  link-check:
    name: lychee (docs + READMEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Config (timeouts, accepted codes, exclude-list) lives in lychee.toml.
          # Scope: integration-facing docs + READMEs. The dated planning/audit
          # archives under docs/superpowers/ and docs/reviews/ are point-in-time
          # artifacts, not live reference, so they are out of scope here.
          args: >-
            --config lychee.toml
            --no-progress
            './*.md'
            './docs/*.md'
            './sdk-python/README.md'
            './sdk-typescript/README.md'
            './n8n-nodes-tokentrimmer/README.md'
            './examples/README.md'
          # Gate the job on broken links (this is the action default; set
          # explicitly so the intent is obvious).
          fail: true
        env:
          # Authenticates GitHub link checks for a higher rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
