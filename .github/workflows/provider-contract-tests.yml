name: provider contract tests (weekly, $-capped)

# Hits real provider APIs to catch upstream drift. Weekly $5 cap enforced by
# the test harness reading prior-run cost from artifacts.

on:
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PROVIDER_WEEKLY_USD_CAP: '5'

permissions:
  contents: read

jobs:
  contract:
    name: provider ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, gemini, mistral, groq, together, openrouter]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Require provider secret
        env:
          PROVIDER: ${{ matrix.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          key_var="$(echo "${PROVIDER}" | tr '[:lower:]' '[:upper:]')_API_KEY"
          if [ -z "${!key_var}" ]; then
            echo "::error::${key_var} repo secret is not configured — contract tests cannot run (operator step, see .claude/ops runbook §3)"
            exit 1
          fi
      - name: Run contract tests
        env:
          PROVIDER: ${{ matrix.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cargo test -p "tt-provider-${PROVIDER}" --features contract -- --ignored --include-ignored

  open-issue-on-failure:
    name: open issue if any provider broke
    needs: contract
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open provider-broken issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          today_date=$(date -u +%Y-%m-%d)
          # The label must exist or `gh issue create --label` fails (the reason
          # every prior failure notification itself failed). --force = idempotent.
          gh label create provider-broken \
            --description "Weekly provider contract tests failing" \
            --color D93F0B --force
          # Dedup: one open tracking issue, comment on repeats instead of spamming.
          existing=$(gh issue list --state open --label provider-broken \
            --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" \
              --body "Weekly provider contract test run failed again (${today_date}). See: ${RUN_URL}"
          else
            gh issue create \
              --title "provider contract tests failing (${today_date})" \
              --label "provider-broken" \
              --body "Weekly provider contract test run failed. See: ${RUN_URL}"
          fi
