# Publishes `tt-cli` and its entire internal dependency chain to crates.io.
#
# Trigger: push a tag like `cli-v0.1.0` (tag version must match the `tt-cli`
# manifest version; other workspace crates may version independently — e.g.
# crates republished after the stale 2026-06-03 upload sit at 0.1.1).
#
# Auth: requires the `CARGO_REGISTRY_TOKEN` repository secret — a crates.io
# API token with publish-new + publish-update scope for the tt-* crates.
#
# Publish order: topological (dependencies first), derived from
# `cargo metadata` over normal+build deps. `cargo publish` (>=1.66) blocks
# until each crate is live in the sparse index, so the next publish in the
# sequence can resolve it. Crates already published at the current version
# are skipped so a failed run can be re-triggered and resume. The skip check
# queries the crates.io API with a descriptive User-Agent (the default curl UA
# is rejected with 403 per crates.io's data-access policy) and branches on the
# HTTP status: 200 = already published (skip), 404 = not published (publish),
# anything else = hard error rather than risking a doomed publish attempt.
#
# tt-ts-types is `publish = false` (internal bindings emitter) and is the only
# workspace crate excluded from this list.
name: release-crates

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Verify each publishable crate ships LICENSE + NOTICE
        run: ./scripts/sync-licenses.sh --check
      - name: Verify tag matches tt-cli manifest version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#cli-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tt-cli") | .version')"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match tt-cli manifest version ${manifest_version}"
            exit 1
          fi
          echo "ok: tag ${GITHUB_REF_NAME} matches tt-cli manifest version ${manifest_version}"
      # Trusted publishing requires one-time crates.io publisher configuration
      # for every crate in this chain. Keep the scoped token path until that
      # external migration is completed as one coordinated release operation.
      - name: Publish in topological order # zizmor: ignore[use-trusted-publishing] external crates.io setup is not yet configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Dependencies before dependents (see header comment).
          crates=(
            tt-shared
            tt-telemetry
            tt-auth
            tt-cache
            tokentrimmer-client
            tt-config
            tt-tokenize
            tt-provider-compat
            tt-provider-openai
            tt-provider-anthropic
            tt-provider-gemini
            tt-provider-groq
            tt-provider-mistral
            tt-provider-together
            tt-provider-openrouter
            tt-provider-local
            tt-preview
            tt-retrieval
            tt-routing
            tt-core
            tt-inspect-core
            tt-inspect-rules-tier1
            tt-plan-core
            tt-mcp
            tt-cli
          )
          # crates.io rejects curl's default User-Agent with 403, so send a
          # descriptive one (https://crates.io/data-access).
          user_agent="tokentrimmer-release (github.com/TokenTrimmer/tokentrimmer)"
          for crate in "${crates[@]}"; do
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version')"
            http_status="$(curl -sS -o /dev/null -w '%{http_code}' \
              --user-agent "$user_agent" \
              "https://crates.io/api/v1/crates/${crate}/${version}")" || http_status="curl-failed"
            case "$http_status" in
              200)
                echo "--- ${crate}@${version} already on crates.io, skipping"
                continue
                ;;
              404)
                ;;
              *)
                echo "::error::crates.io returned ${http_status} for ${crate}@${version}; cannot determine publish state, aborting"
                exit 1
                ;;
            esac
            echo "--- publishing ${crate}@${version}"
            cargo publish -p "$crate"
          done
