# Publishes the `@tokentrimmer/client` TypeScript SDK (sdk-typescript/) to npm.
#
# Trigger: push a tag like `ts-v0.1.0` (tag version must match
# sdk-typescript/package.json `version`).
#
# Auth: requires the `NPM_TOKEN` repository secret — an npm automation
# (granular access) token with publish rights to the @tokentrimmer scope.
# Provenance attestation (`--provenance`) additionally needs `id-token: write`
# and a public repository, both satisfied here.
name: release-npm

on:
  push:
    tags:
      - 'ts-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestation (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#ts-v}"
          manifest_version="$(node -p "require('./sdk-typescript/package.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match sdk-typescript/package.json version ${manifest_version}"
            exit 1
          fi
          echo "ok: tag ${GITHUB_REF_NAME} matches package.json version ${manifest_version}"
      - name: Install
        run: npm install
        working-directory: sdk-typescript
      - name: Build
        run: npm run build
        working-directory: sdk-typescript
      - name: Test
        run: npm test
        working-directory: sdk-typescript
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: sdk-typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
