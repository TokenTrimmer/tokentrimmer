# Publishes the `n8n-nodes-tokentrimmer` community node (n8n-nodes-tokentrimmer/) to npm.
#
# Trigger: push a tag like `n8n-v0.1.0` (tag version must match
# n8n-nodes-tokentrimmer/package.json `version`).
#
# Auth: requires the `NPM_TOKEN` repository secret — an npm automation
# (granular access) token with publish rights to the package (same secret as
# release-npm.yml). Provenance attestation (`--provenance`) additionally needs
# `id-token: write` and a public repository, both satisfied here.
name: release-n8n

on:
  push:
    tags:
      - 'n8n-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestation (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#n8n-v}"
          manifest_version="$(node -p "require('./n8n-nodes-tokentrimmer/package.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match n8n-nodes-tokentrimmer/package.json version ${manifest_version}"
            exit 1
          fi
          echo "ok: tag ${GITHUB_REF_NAME} matches package.json version ${manifest_version}"
      - name: Install
        run: npm ci
        working-directory: n8n-nodes-tokentrimmer
      - name: Build
        run: npm run build
        working-directory: n8n-nodes-tokentrimmer
      - name: Test
        run: npm test
        working-directory: n8n-nodes-tokentrimmer
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: n8n-nodes-tokentrimmer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
