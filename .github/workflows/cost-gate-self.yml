name: cost-gate (dogfood)

# Dogfoods the local cost-gate action (inspect-action/) on our own PRs.
# Report-only so a legitimate model change never blocks merge — the value here
# is exercising the action end-to-end and surfacing the cost delta as a comment.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-gate:
    name: tt inspect --cost-diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build CLI
        run: cargo build -p tt-cli --release
      - name: Put tt on PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"
      - name: Cost gate (report-only on self)
        uses: ./inspect-action
        with:
          path: .
          fail-on-cost-increase: false
