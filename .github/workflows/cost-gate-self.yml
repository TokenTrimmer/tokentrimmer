name: cost-gate (dogfood)

# Dogfoods the local cost-gate action (inspect-action/) on our own PRs.
# Report-only so a legitimate model change never blocks merge — the value here
# is exercising the action end-to-end and surfacing the cost delta as a comment.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  cost-gate:
    name: tt inspect --cost-diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build CLI
        run: cargo build -p tt-cli --release
      - name: Put tt on PATH
        run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"
      - name: Cost gate (report-only on self)
        uses: ./inspect-action
        with:
          path: .
          fail-on-cost-increase: false
