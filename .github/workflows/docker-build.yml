name: docker build & publish

# Build the `tt` CLI image and push to GHCR on every merge to main.
# PRs build but do NOT push — they verify the Dockerfile still works.
#
# The Dockerfile COPYs the committed THIRD-PARTY-LICENSES (plus LICENSE +
# NOTICE) into the image for dependency attribution. That file is kept current
# by the `third-party-licenses` job in ci.yml (cargo-about --check), so this
# workflow trusts the committed copy rather than re-running cargo-about here.

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tt-cli

jobs:
  build:
    name: build (+ push on main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          # GHCR/OCI repository names must be lowercase; the org is "TokenTrimmer".
          image=$(printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          tags="${image}:${SHA}"
          if [ "$EVENT" = "push" ] && [ "$REF_NAME" = "main" ]; then
            tags="${tags},${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # BuildKit attaches in-toto/SLSA provenance and an SPDX SBOM
          # to every pushed GHCR image. PR builds still validate the Dockerfile;
          # attestations are published only with the immutable image artifact.
          provenance: mode=max
          sbom: true
