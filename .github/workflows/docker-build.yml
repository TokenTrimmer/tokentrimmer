name: docker build & publish

# Build the `tt` CLI image on an explicit checkpoint. A protected-main dispatch
# also publishes immutable-SHA and `latest` tags; arbitrary refs only build.
#
# The Dockerfile COPYs the committed THIRD-PARTY-LICENSES (plus LICENSE +
# NOTICE) into the image for dependency attribution. That file is kept current
# by the `third-party-licenses` job in ci.yml (cargo-about --check), so this
# workflow trusts the committed copy rather than re-running cargo-about here.

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tt-cli

jobs:
  build:
    name: build (+ publish on protected-main dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          # GHCR/OCI repository names must be lowercase; the org is "TokenTrimmer".
          image=$(printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          tags="${image}:${SHA}"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF_NAME" = "main" ]; then
            tags="${tags},${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build (and publish on protected-main dispatch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # BuildKit attaches in-toto/SLSA provenance and an SPDX SBOM
          # to every pushed GHCR image. PR builds still validate the Dockerfile;
          # attestations are published only with the immutable image artifact.
          provenance: mode=max
          sbom: true
