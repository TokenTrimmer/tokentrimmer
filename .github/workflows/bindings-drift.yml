name: bindings drift check

# Regenerates TS bindings from Rust types and fails if differs from committed.
# Catches the most common failure mode of the two-language stack.

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  bindings:
    name: TS bindings drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Regenerate bindings
        run: cargo test -p tt-ts-types
      - name: Fail if bindings drifted
        run: |
          if ! git diff --quiet; then
            echo "::error::TS bindings drifted. Run 'cargo test -p tt-ts-types' locally, commit the result."
            git diff
            exit 1
          fi
