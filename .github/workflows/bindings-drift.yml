name: TS bindings placeholder

# HONESTY NOTE: real TS binding generation is not wired yet. `tt-ts-types` is a
# reserved placeholder crate with no `ts-rs` derives and no emitted bindings.
#
# Keep the historical job name below for branch-protection compatibility, but
# this workflow is NOT a drift guard. Replace it with a real regenerate+diff job
# when `crates/ts-types` actually emits files.

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  bindings:
    name: TS bindings drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Compile placeholder crate
        run: cargo test -p tt-ts-types
      - name: Warn that no drift guard exists yet
        run: |
          echo "::warning title=TS bindings not generated::tt-ts-types is still a placeholder. This check does not regenerate or diff TypeScript bindings."
