name: TS bindings drift

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  bindings:
    name: TS bindings drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check generated product/proof schemas, TypeScript, vectors, and manifests
        run: cargo run --locked -p tt-ts-types -- check
      - name: Verify fixed signatures and forged fixtures independently
        run: node scripts/verify-receipt-contracts.mjs
      - name: Verify product manifests, schemas, vectors, and TypeScript independently
        run: node scripts/verify-product-contracts.mjs
      - name: Test the Rust generator and production verifiers
        run: cargo test --locked -p tt-ts-types
