name: TS bindings drift

# HONESTY NOTE: this workflow is NOT a real drift guard yet. TS binding generation
# is not wired — `tt-ts-types` (crates/ts-types) is a reserved placeholder crate
# with no `ts-rs` derives and no emitted `bindings/` output. All this job can do is
# compile that placeholder and emit a warning; it can never fail on drift, because
# there is nothing to regenerate or diff. A real regenerate-and-`git diff
# --exit-code` guard goes here once `crates/ts-types` actually emits files.
#
# The job name is intentionally kept as "TS bindings drift" so it keeps satisfying
# the existing required status check of that name on `main` (renaming it would
# leave that required context permanently unreported and block every PR).
# >>> RECOMMENDED FOLLOW-UP (user-gated): either implement the real drift guard
# above, or DROP "TS bindings drift" from the required status checks, since it
# currently provides no real assurance (it only emits a warning). <<<

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  bindings:
    # Name kept as the required context "TS bindings drift" (see header note); the
    # warning step below makes the honest reality explicit — placeholder, not a guard.
    name: TS bindings drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Compile placeholder crate
        run: cargo test -p tt-ts-types
      - name: Warn that no drift guard exists yet
        run: |
          echo "::warning title=TS bindings not generated::tt-ts-types is still a placeholder. This check does not regenerate or diff TypeScript bindings."
