name: TS bindings placeholder

# HONESTY NOTE: this workflow is NOT a drift guard. Real TS binding generation is
# not wired yet — `tt-ts-types` (crates/ts-types) is a reserved placeholder crate
# with no `ts-rs` derives and no emitted `bindings/` output. All this job can do
# is compile that placeholder and emit a warning; it can never fail on drift,
# because there is nothing to regenerate or diff. A real regenerate-and-`git
# diff --exit-code` guard goes here once `crates/ts-types` actually emits files.
#
# >>> OPERATOR ACTION REQUIRED (user-gated branch-protection settings change) <<<
# The check formerly published as the required context "TS bindings drift" — a
# no-op that nonetheless blocked merges and gave false drift assurance. The job
# name below has been made honest ("TS bindings (placeholder)"), which CHANGES
# the check-run name. You MUST update branch protection on `main` to match:
#   PREFERRED: remove "TS bindings drift" from the required status checks
#              entirely (there is no real guard to gate on yet); OR
#   if you want the placeholder to keep reporting: replace the required context
#              "TS bindings drift" with "TS bindings (placeholder)".
# Until you do one of these, the old required context "TS bindings drift" will
# never report and every PR will hang waiting on it.

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  bindings:
    # Honest name: this is a placeholder, not a drift guard (see header note).
    # NOTE: renaming this from the old "TS bindings drift" changes the check-run
    # name — coordinate the branch-protection update flagged in the header.
    name: TS bindings (placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Compile placeholder crate
        run: cargo test -p tt-ts-types
      - name: Warn that no drift guard exists yet
        run: |
          echo "::warning title=TS bindings not generated::tt-ts-types is still a placeholder. This check does not regenerate or diff TypeScript bindings."
