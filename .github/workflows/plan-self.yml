name: plan-self (dogfood)

# Required check as of Week 17 — replay engine is live and the snapshot test
# guards against deterministic-output drift. Any change to the replay math
# that perturbs the canned-input snapshot fails this check.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  plan:
    name: plan replay determinism
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Plan engine — determinism + snapshot + bootstrap CI coverage
        run: cargo test -p tt-plan-core
