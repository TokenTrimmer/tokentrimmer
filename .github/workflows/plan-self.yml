name: plan-self (dogfood)

# Required check as of Week 17 — replay engine is live and the snapshot test
# guards against deterministic-output drift. Any change to the replay math
# that perturbs the canned-input snapshot fails this check.

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan replay determinism
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Plan engine — determinism + snapshot + bootstrap CI coverage
        run: cargo test -p tt-plan-core
