name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-and-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # NOTE: a `test-changed` (changed-crate subset) job used to run here too, but it
  # was a non-required, redundant subset of `test-workspace` below (the full,
  # required gate). It was dropped to free runner minutes — `test-workspace`
  # already covers every crate on every PR.
  test-workspace:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --workspace --no-fail-fast

  db-tests:
    name: cargo test (DB-gated, --include-ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres + pgvector (the L2 semantic cache needs the `vector` extension)
    # and Redis (the L1 cache round-trip). These back the #[ignore]d,
    # TEST_DATABASE_URL/DATABASE_URL/REDIS_URL-gated tests that the other jobs
    # never run: PostgresKeyStore, the pgvector L2 cache + tenant isolation,
    # the migrate-only path, and the BYO credential-store wiring.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tt-core migrations, tt-auth PostgresKeyStore, and the CLI BYO test read
      # TEST_DATABASE_URL; the tt-cache L2 tests read DATABASE_URL. Point both at
      # the same pgvector service. tt-cache L1 reads REDIS_URL.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Apply the public schema (creates cache_entries with pgvector) before the
      # L2 tests, which assume the table already exists. The migrate-only test
      # is itself one of the ignored tests we want covered, and it's idempotent.
      - name: Apply migrations (tt-core migrate_only)
        run: cargo test -p tt-core --test migrations -- --include-ignored migrate_only_applies_schema
      # Postgres key store: issue -> validate -> revoke -> cross-org isolation.
      # PostgresKeyStore is gated behind tt-auth's `postgres` feature, which the
      # default workspace build does not enable — so scope + feature it here.
      - name: tt-auth Postgres key store (ignored)
        run: cargo test -p tt-auth --features postgres -- --include-ignored
      # L2 pgvector cache: round-trip + org-A-insert / org-B-miss isolation.
      - name: tt-cache L2 + L1 (ignored)
        run: cargo test -p tt-cache -- --include-ignored
      # BYO credential-store wiring (creates its own provider_credentials table).
      - name: tt-cli BYO credential wiring (ignored)
        run: cargo test -p tt-cli -- --include-ignored byo_only

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action requires a paid license for organization
      # repos; the gitleaks binary is free (MIT). Allowlist in .gitleaks.toml.
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan git history for secrets
        run: gitleaks git . --no-banner --redact -c .gitleaks.toml

  license-check:
    name: cargo deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check licenses advisories bans sources

  # Each publishable crate must ship its own LICENSE + NOTICE so `cargo publish`
  # tarballs (and thus crates.io) carry the Apache-2.0 text. scripts/sync-licenses.sh
  # keeps those copies in lockstep with the root files; --check fails on drift.
  per-crate-licenses:
    name: per-crate LICENSE + NOTICE present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - run: ./scripts/sync-licenses.sh --check

  # THIRD-PARTY-LICENSES (cargo-about) is copied into the GHCR image to attribute
  # the bundled deps. Regenerate + fail on drift so it never goes stale; --fail
  # also rejects any dependency whose license isn't in about.toml's allow-list.
  third-party-licenses:
    name: THIRD-PARTY-LICENSES up to date (cargo-about)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo install --locked cargo-about --features cli
      - run: ./scripts/gen-third-party-licenses.sh --check

  cargo-audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo install --locked cargo-audit
      # Transitive advisories with no reachable fix in our tree (see deny.toml
      # for the rustls-webpki / rsa rationale). The two RUSTSEC-2025 entries are
      # `unmaintained` warnings (async-std, rustls-pemfile) pulled transitively.
      - run: >
          cargo audit
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0049
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2025-0052
          --ignore RUSTSEC-2025-0134
