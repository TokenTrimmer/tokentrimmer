name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-and-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-changed:
    name: cargo test (changed crates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Detect changed crates
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE_SHA:-HEAD~1}"
          changed=$(git diff --name-only "$base"...HEAD | grep -E '^crates/' | awk -F/ '{print $2}' | sort -u | tr '\n' ' ')
          echo "crates=${changed}" >> "$GITHUB_OUTPUT"
      - name: Test changed crates
        if: steps.changed.outputs.crates != ''
        env:
          CRATES: ${{ steps.changed.outputs.crates }}
        run: |
          for c in $CRATES; do
            crate_name=$(grep -E '^name' "crates/$c/Cargo.toml" | head -1 | sed -E 's/name *= *"([^"]+)".*/\1/' || true)
            [ -z "$crate_name" ] || cargo test -p "$crate_name" --no-fail-fast
          done

  test-workspace:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action requires a paid license for organization
      # repos; the gitleaks binary is free (MIT). Allowlist in .gitleaks.toml.
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan git history for secrets
        run: gitleaks git . --no-banner --redact -c .gitleaks.toml

  license-check:
    name: cargo deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  cargo-audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit
      # Transitive advisories with no reachable fix in our tree (see deny.toml
      # for the rustls-webpki / rsa rationale). The two RUSTSEC-2025 entries are
      # `unmaintained` warnings (async-std, rustls-pemfile) pulled transitively.
      - run: >
          cargo audit
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0049
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2025-0052
          --ignore RUSTSEC-2025-0134
