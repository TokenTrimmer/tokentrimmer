name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # This is a blocking workflow-security gate. It intentionally uses verified
  # release archives rather than a mutable Marketplace action so the checker
  # itself has an immutable version and digest.
  workflow-security:
    name: workflow syntax + supply-chain security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test and enforce immutable action pins
        run: |
          node --test .github/scripts/workflow-security-policy.test.mjs
          node .github/scripts/workflow-security-policy.mjs
      - name: Install checksum-verified workflow analyzers
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ZIZMOR_VERSION: "1.27.0"
          ZIZMOR_SHA256: "277f2bd8fd37cf60c42ab7afca6faa884e65440fa31e02b44bdaae60f62a358f"
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/workflow-security-tools"
          mkdir -p "$tools"
          actionlint_archive="$tools/actionlint.tar.gz"
          zizmor_archive="$tools/zizmor.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -o "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check --strict
          tar -xzf "$actionlint_archive" -C "$tools" actionlint
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -o "$zizmor_archive" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$ZIZMOR_SHA256" "$zizmor_archive" | sha256sum --check --strict
          tar -xzf "$zizmor_archive" -C "$tools" zizmor
          echo "$tools" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions syntax
        run: actionlint -color -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Analyze GitHub Actions security posture
        run: zizmor .github/workflows

  deploy-trigger-policy:
    name: deploy trigger policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: node --test .github/scripts/*.test.mjs

  fmt-and-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # NOTE: a `test-changed` (changed-crate subset) job used to run here too, but it
  # was a non-required, redundant subset of `test-workspace` below (the full,
  # required gate). It was dropped to free runner minutes — `test-workspace`
  # already covers every crate on every PR.
  test-workspace:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --workspace --no-fail-fast

  db-tests:
    name: cargo test (DB-gated, --include-ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres + pgvector (the L2 semantic cache needs the `vector` extension)
    # and Redis (the L1 cache round-trip). These back the #[ignore]d,
    # TEST_DATABASE_URL/DATABASE_URL/REDIS_URL-gated tests that the other jobs
    # never run: PostgresKeyStore, the pgvector L2 cache + tenant isolation,
    # the migrate-only path, immutable workflow-version history, and the BYO
    # credential-store wiring.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tt-core migrations, tt-auth PostgresKeyStore, and the CLI BYO test read
      # TEST_DATABASE_URL; the tt-cache L2 tests read DATABASE_URL. Point both at
      # the same pgvector service. tt-cache L1 reads REDIS_URL.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Apply the public schema (creates cache_entries with pgvector) before the
      # L2 tests, which assume the table already exists. The migrate-only test
      # is itself one of the ignored tests we want covered, and it's idempotent.
      - name: Apply migrations (tt-core migrate_only)
        run: cargo test -p tt-core --test migrations -- --include-ignored migrate_only_applies_schema
      # Exercise the complete production request-log INSERT bind chain against
      # the migrated schema, including nonzero itemized cost components.
      - name: tt-core request-log cost breakdown PostgreSQL round trip (ignored)
        run: >-
          cargo test -p tt-core --test migrations
          request_logs_insert_round_trips_against_postgres
          -- --include-ignored --exact
      # Canonical route persistence: exact canonical JSON reaches PostgreSQL,
      # management readback retains the active hash, and the production
      # PostgreSQL runtime store feeds the real matcher.
      - name: tt-core canonical route PostgreSQL round trip (ignored)
        run: cargo test -p tt-core --test routes_pg -- --include-ignored
      # Exact retained-definition reads, newest-first history, value-free
      # comparison inputs, and conditional immutable appends must stay bounded,
      # concurrency-safe, and tenant-scoped against the migrated schema.
      - name: tt-core workflow version history (ignored)
        run: >-
          cargo test -p tt-core --lib
          workflow::store::tests::definition_version_history_is_exact_bounded_and_org_scoped
          -- --include-ignored --exact
      # Postgres key store: issue -> validate -> revoke -> cross-org isolation.
      # PostgresKeyStore is gated behind tt-auth's `postgres` feature, which the
      # default workspace build does not enable — so scope + feature it here.
      - name: tt-auth Postgres key store (ignored)
        run: cargo test -p tt-auth --features postgres -- --include-ignored
      # Body-capture master-key re-encryption (TT_MASTER_KEY rotation): re-keys
      # request_body_captures. Gated behind tt-telemetry's `postgres` feature,
      # like tt-auth above; creates + clears its own table.
      - name: tt-telemetry body-capture reencrypt (ignored)
        run: cargo test -p tt-telemetry --features postgres -- --include-ignored
      # L2 pgvector cache: round-trip + org-A-insert / org-B-miss isolation.
      - name: tt-cache L2 + L1 (ignored)
        run: cargo test -p tt-cache -- --include-ignored
      # BYO credential-store wiring (creates its own provider_credentials table).
      - name: tt-cli BYO credential wiring (ignored)
        run: cargo test -p tt-cli -- --include-ignored byo_only

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks GitHub Action requires a paid license for organization
      # repos; the gitleaks binary is free (MIT). Allowlist in .gitleaks.toml.
      - name: Install checksum-verified gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/secret-scan-tools"
          archive="$tools/gitleaks.tar.gz"
          mkdir -p "$tools"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tools" gitleaks
          echo "$tools" >> "$GITHUB_PATH"
      - name: Scan git history for secrets
        run: gitleaks git . --no-banner --redact -c .gitleaks.toml

  license-check:
    name: cargo deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check licenses advisories bans sources

  # Each publishable crate must ship its own LICENSE + NOTICE so `cargo publish`
  # tarballs (and thus crates.io) carry the Apache-2.0 text. scripts/sync-licenses.sh
  # keeps those copies in lockstep with the root files; --check fails on drift.
  per-crate-licenses:
    name: per-crate LICENSE + NOTICE present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - run: ./scripts/sync-licenses.sh --check

  # THIRD-PARTY-LICENSES (cargo-about) is copied into the GHCR image to attribute
  # the bundled deps. Regenerate + fail on drift so it never goes stale; --fail
  # also rejects any dependency whose license isn't in about.toml's allow-list.
  third-party-licenses:
    name: THIRD-PARTY-LICENSES up to date (cargo-about)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Pin the version: an unpinned cargo-about silently re-rendered the file
      # on unrelated PRs (THIRD-PARTY-LICENSES drift). Pin it to the version the
      # committed file was generated with so local + CI are deterministic; bump
      # in lockstep when regenerating.
      - run: cargo install --locked cargo-about --version 0.9.0 --features cli
      - run: ./scripts/gen-third-party-licenses.sh --check

  cargo-audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo install --locked cargo-audit
      # Transitive advisories with no reachable fix in our tree (see deny.toml
      # for the rustls-webpki / rsa rationale). The two RUSTSEC-2025 entries are
      # `unmaintained` warnings (async-std, rustls-pemfile) pulled transitively.
      - run: >
          cargo audit
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0049
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2025-0052
          --ignore RUSTSEC-2025-0134

  # No deployment secret is reachable until every required CI job has passed
  # and the event is proven to be the current protected-main push. The policy
  # is fail-closed and adversarially tested in `deploy-trigger-policy` above.
  authorize-deploy:
    name: authorize protected-main deploy
    needs:
      - workflow-security
      - deploy-trigger-policy
      - fmt-and-clippy
      - test-workspace
      - db-tests
      - secret-scan
      - license-check
      - per-crate-licenses
      - third-party-licenses
      - cargo-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.policy.outputs.trusted }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: policy
        name: Verify same-repository protected-main head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/deploy-trigger-policy.mjs

  deploy-gateway:
    name: deploy gateway after trusted CI
    needs: authorize-deploy
    # Repeat the event/ref predicate at the secret-bearing call site so an
    # absent or future-bypassed authorization output cannot turn a PR-like
    # event into a reusable-workflow invocation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.authorize-deploy.outputs.trusted == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    # Keep the reusable workflow's secret surface narrow. The caller/callee
    # topology is statically checked in workflow-security-policy.mjs.
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      STAGING_DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
      PROD_DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL_DIRECT }}
