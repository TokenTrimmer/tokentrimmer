# ─────────────────────────────────────────────────────────────────────────────
# Deploy: gateway (public) → staging → prod   (Phase 2 automation)
#
# Flow (per cloud/docs/superpowers/specs/2026-06-02-local-staging-prod-pipeline-design.md):
#   CI passes on main ─▶ (workflow_run) job `staging` : migrate staging DB →
#                       │ (auto, only on CI success)    flyctl deploy fly.staging.toml
#                  job `prod`      : needs staging + MANUAL APPROVAL (GH Environment)
#                                    migrate prod DB → flyctl deploy fly.toml
#
#   Staging is gated on a SUCCESSFUL CI run, NOT on a raw push to main: this
#   workflow triggers via `workflow_run` on completion of the `CI` workflow and
#   every deploy job carries `github.event.workflow_run.conclusion == 'success'`
#   (a red/cancelled CI never reaches staging). Deploys check out + ship the exact
#   commit CI validated (`github.event.workflow_run.head_sha`), not main's tip.
#
#   The gateway only owns the public.* schema, but it shares ONE Neon DB with the
#   cloud surfaces, so migrations are applied via the strict `tt gateway
#   --migrate-only` entrypoint against the Neon DIRECT (non-pooled) endpoint
#   (session advisory locks). `flyctl deploy --remote-only` builds on Fly's remote
#   builder, so the runner needs no Docker for the deploy itself; the `tt` binary
#   is built locally only to run the migrator.
#
#   NOTE on cross-repo ordering: the design's full per-env order is
#   migrate → tt-api → gateway → dashboard. tt-api + dashboard live in the cloud
#   repo (cloud/.github/workflows/deploy.yml); this workflow owns the gateway leg.
#
# ── OPERATOR SETUP (one-time, done by a human — NOT by this workflow) ─────────
#   1. FLY_API_TOKEN  (repo secret)
#        Generate a deploy-scoped token:  fly tokens deploy
#        (org `personal`; covers tokentrimmer + tokentrimmer-staging).
#   2. GitHub Environment `production`  (Settings ▸ Environments ▸ New environment)
#        Add a "Required reviewers" protection rule so the `prod` job pauses for a
#        manual approval. WITHOUT this gate prod auto-deploys — do not remove
#        `environment: production` from the prod job.
#   3. DB migrate secrets (repo secrets), each the Neon DIRECT / non-pooled URL:
#        STAGING_DATABASE_URL_DIRECT  → Neon `staging` branch, direct host.
#        PROD_DATABASE_URL_DIRECT     → Neon `production` branch, direct host.
#      (Per-PR ephemeral Neon DBs are wired on the cloud repo's neon-pr.yml, which
#       also applies the gateway's migrations — the public repo keeps its
#       throwaway-Postgres service container in ci.yml and needs no Neon secrets.)
#
# Never auto-deploy prod without the `production` environment gate.
# ─────────────────────────────────────────────────────────────────────────────
name: deploy (gateway)

on:
  # Gate staging on a SUCCESSFUL CI run instead of a raw push to main. This fires
  # when the `CI` workflow (ci.yml) completes on the `main` branch; the deploy
  # jobs then require `workflow_run.conclusion == 'success'`. (PR CI runs carry a
  # non-main head branch, so the `branches: [main]` filter excludes them.)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: # allow a manual re-run of the pipeline
    inputs:
      deploy_prod:
        description: "Also deploy production after staging succeeds"
        required: false
        default: false
        type: boolean

# One deploy at a time; never cancel an in-flight deploy.
concurrency:
  group: deploy-gateway
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Preflight: are the deploy secrets configured? ────────────────────────────
  # GitHub forbids `secrets` in job-level `if:`, so a tiny job reads them into an
  # output and `staging` gates on it; `prod` cascade-skips via `needs`. When the
  # secrets are absent this job FAILS LOUDLY — an unconfigured deploy pipeline
  # must never read as a green run (it hid a never-deployed prod for weeks).
  # Set FLY_API_TOKEN + STAGING_DATABASE_URL_DIRECT (and, for prod,
  # PROD_DATABASE_URL_DIRECT + the `production` Environment gate — see header).
  preflight:
    name: deploy configured?
    # Only proceed when the triggering CI run passed (workflow_run) or on a manual
    # dispatch. A failed/cancelled CI run skips this job, which cascade-skips
    # staging + prod via `needs`. This is the CI-success gate for the pipeline.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGING_DATABASE_URL_DIRECT: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
        run: |
          if [ -n "$FLY_API_TOKEN" ] && [ -n "$STAGING_DATABASE_URL_DIRECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Gateway deploy NOT configured — set FLY_API_TOKEN + STAGING_DATABASE_URL_DIRECT (and PROD_DATABASE_URL_DIRECT + the production Environment) to enable (see header). Failing loudly so a dead pipeline can't look green."
            exit 1
          fi

  # ── STAGING ────────────────────────────────────────────────────────────────
  staging:
    name: staging (migrate → deploy)
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out the exact commit CI validated (workflow_run.head_sha), not
      # main's tip — for workflow_dispatch this falls back to the dispatched ref.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Build `tt` from THIS commit so the embedded migrator (migrate! embeds SQL
      # at compile time) reflects the migrations being deployed. The bin is `tt`.
      - name: Build tt CLI (embeds current migrations)
        run: cargo build -p tt-cli --bin tt --locked --release

      - name: Apply staging migrations (Neon DIRECT endpoint)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
        run: ./target/release/tt gateway --migrate-only

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # TT_GIT_SHA is baked into the image (Dockerfile ARG) and surfaced as
      # "git_sha" in /health, so deployed-sha-drift.yml can compare it to main.
      - name: Deploy gateway → tokentrimmer-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TT_GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: flyctl deploy --remote-only --config fly.staging.toml --build-arg "TT_GIT_SHA=$TT_GIT_SHA"

      - name: Post-deploy staging smoke (wake scale-to-zero, check /health)
        run: |
          curl -sf --retry 8 --retry-all-errors --retry-delay 5 \
            https://tokentrimmer-staging.fly.dev/health

  # ── PROD ─────────────────────────────────────────────────────────────────────
  # Gated by the `production` GitHub Environment → requires a manual approval
  # before this job starts. A failed staging deploy blocks it via `needs`.
  prod:
    name: prod (migrate → deploy)
    needs: staging
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_prod == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      # prod is workflow_dispatch-only, so head_sha is empty here and this falls
      # back to the dispatched ref — kept symmetric with staging.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build tt CLI (embeds current migrations)
        run: cargo build -p tt-cli --bin tt --locked --release

      - name: Apply prod migrations (Neon DIRECT endpoint)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_DIRECT }}
        run: ./target/release/tt gateway --migrate-only

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy gateway → tokentrimmer
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TT_GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: flyctl deploy --remote-only --config fly.toml --build-arg "TT_GIT_SHA=$TT_GIT_SHA"

      - name: Post-deploy prod smoke
        run: |
          curl -sf --retry 5 --retry-all-errors --retry-delay 5 \
            https://tokentrimmer.fly.dev/health
