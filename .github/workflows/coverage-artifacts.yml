name: coverage artifacts

# Non-blocking coverage collection. This workflow uploads artifacts for review
# and trend-spotting, but it is deliberately not a merge gate yet.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'sdk-typescript/**'
      - 'n8n-nodes-tokentrimmer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/coverage-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'sdk-typescript/**'
      - 'n8n-nodes-tokentrimmer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/coverage-artifacts.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust llvm-cov artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Collect coverage
        run: cargo llvm-cov --workspace --lcov --output-path target/coverage/lcov.info
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-lcov
          path: target/coverage/lcov.info
          if-no-files-found: warn

  typescript-sdk:
    name: TypeScript SDK vitest coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Install
        run: cd sdk-typescript && npm ci
      - name: Install Vitest coverage provider
        run: cd sdk-typescript && npm install --no-save @vitest/coverage-v8@4.1.8
      - name: Collect coverage
        run: cd sdk-typescript && npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reporter=text-summary --coverage.reportsDirectory=coverage
      - name: Upload TypeScript SDK coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-sdk-lcov
          path: sdk-typescript/coverage/lcov.info
          if-no-files-found: warn

  n8n:
    name: n8n vitest coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Install
        run: cd n8n-nodes-tokentrimmer && npm ci --ignore-scripts
      - name: Install Vitest coverage provider
        run: cd n8n-nodes-tokentrimmer && npm install --no-save --ignore-scripts @vitest/coverage-v8@4.1.8
      - name: Collect coverage
        run: cd n8n-nodes-tokentrimmer && npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reporter=text-summary --coverage.reportsDirectory=coverage
      - name: Upload n8n coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: n8n-lcov
          path: n8n-nodes-tokentrimmer/coverage/lcov.info
          if-no-files-found: warn
