name: coverage artifacts

# Non-blocking coverage collection. This workflow uploads artifacts for review
# and trend-spotting, but it is deliberately not a merge gate yet.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust llvm-cov artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Collect coverage
        # `--output-path` does not create the parent dir; ensure it exists so
        # the report write does not fail with ENOENT on a clean target/.
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --workspace --lcov --output-path target/coverage/lcov.info
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-lcov
          path: target/coverage/lcov.info
          if-no-files-found: warn

  typescript-sdk:
    name: TypeScript SDK vitest coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install
        run: cd sdk-typescript && npm ci
      - name: Collect coverage
        run: cd sdk-typescript && npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reporter=text-summary --coverage.reportsDirectory=coverage
      - name: Upload TypeScript SDK coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-sdk-lcov
          path: sdk-typescript/coverage/lcov.info
          if-no-files-found: warn

  n8n:
    name: n8n vitest coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install
        run: cd n8n-nodes-tokentrimmer && npm ci --ignore-scripts
      - name: Collect coverage
        run: cd n8n-nodes-tokentrimmer && npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reporter=text-summary --coverage.reportsDirectory=coverage
      - name: Upload n8n coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: n8n-lcov
          path: n8n-nodes-tokentrimmer/coverage/lcov.info
          if-no-files-found: warn

  python-sdk:
    name: Python SDK pytest coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Editable install so coverage maps back to sdk-python/tokentrimmer; the
      # [test] extra pulls pytest/pytest-asyncio/respx (see pyproject.toml).
      - name: Install (SDK + test deps + coverage.py)
        run: pip install -e "sdk-python[test]" "coverage>=7"
      - name: Collect coverage
        # coverage.py emits lcov to mirror the rust/ts/n8n artifacts. --source
        # scopes measurement to the package; the run is non-blocking.
        run: |
          mkdir -p sdk-python/coverage
          cd sdk-python
          python -m coverage run --source=tokentrimmer -m pytest tests/ -q
          python -m coverage lcov -o coverage/lcov.info
      - name: Upload Python SDK coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdk-lcov
          path: sdk-python/coverage/lcov.info
          if-no-files-found: warn
