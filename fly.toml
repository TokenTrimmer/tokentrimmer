# Fly.io deployment manifest for the TokenTrimmer Gateway.
#
# Per ADR-010 (single region until $5K MRR), we deploy only to `iad`.
# Add additional regions with `fly scale count` and re-issuing this file
# only when EU customers exceed 20% of base or enterprise APAC demand exists.
#
# Required secrets (set with `fly secrets set KEY=value`):
#   DATABASE_URL        Neon Postgres connection string
#   REDIS_URL           Upstash Redis URL
#   TT_MASTER_KEY       Shared 32-byte encryption/HMAC root; rotate only via docs/SECRETS.md
#   OTEL_EXPORTER_OTLP_ENDPOINT  (optional) — enables OTLP tracing export
#
# Deploy: `fly deploy`

app            = "tokentrimmer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Bluegreen avoids a brown-out on single-machine deploys: a rolling deploy on
# one machine takes it down mid-deploy. Bluegreen boots a fresh machine, health-
# checks it, then cuts over (Fly spins a temporary one when min_machines == 1).
[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port      = 8080
  force_https        = true
  # Gateway is always-on — sub-30ms p50 latency budget requires no cold starts.
  # See ADR-016 in .claude/DECISIONS.md for the tradeoff vs scale-to-zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes          = ["app"]

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "GET"
    path         = "/health"

[[vm]]
  size   = "shared-cpu-2x"
  memory = "512mb"

[env]
  RUST_LOG  = "info,tt_core=info,tt_provider_openai=info"
  PORT      = "8080"
