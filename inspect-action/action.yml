name: TokenTrimmer Cost Gate
description: >-
  Gate pull requests on projected LLM cost changes. Runs
  `tt inspect --cost-diff` over the PR diff and (optionally) fails the check on a
  projected per-call cost increase, posting the cost delta as a sticky PR comment.
author: TokenTrimmer Contributors
branding:
  icon: dollar-sign
  color: green

inputs:
  path:
    description: Path to scope the cost diff to (relative to repo root).
    required: false
    default: .
  base-ref:
    description: >-
      Base git ref to diff the working tree against. Defaults to the pull
      request's base SHA on `pull_request` events, otherwise `HEAD`. The ref
      must be fetched — use `actions/checkout` with `fetch-depth: 0`.
    required: false
    default: ''
  fail-on-cost-increase:
    description: >-
      When `true`, the check fails (non-zero exit) if a net projected per-call
      cost increase is detected. Set to `false` to report only.
    required: false
    default: 'true'
  budget-file:
    description: >-
      Path to a `.tokentrimmer/budgets.toml` (relative to the repo root)
      declaring per-glob `max_call_usd` ceilings + a global `max_pr_delta_usd`
      cap. When set, the check ALSO fails on any budget violation (in addition
      to `fail-on-cost-increase`). Leave empty to disable budget gating.
    required: false
    default: ''
  comment:
    description: >-
      When `true` (and the event is a pull request), post or update a sticky PR
      comment with the cost-diff report.
    required: false
    default: 'true'
  github-token:
    description: Token used to post the PR comment. Defaults to the workflow token.
    required: false
    default: ${{ github.token }}
  tt-version:
    description: >-
      Immutable 40-character commit SHA of the TokenTrimmer repository used to
      build tt-cli. Mutable branch and tag names are deliberately rejected.
    required: false
    # Keep this source pin in step with the action release. It is mirrored in
    # source-build-contract.json and the shipped examples; CI rejects drift.
    # A full commit SHA is immutable even if a branch or lightweight tag is
    # later force-pushed.
    default: 117b8d69c01e5a56a6c548355ef9453f6cdfaeac
  upload-sarif:
    description: >-
      When `true`, additionally run the Inspect static-analysis rules over
      `path` and upload the results as SARIF 2.1.0 to the GitHub Code Scanning /
      Security tab (and inline PR annotations). This is independent of the
      cost-diff gate above. Requires `permissions: security-events: write` in
      the calling workflow; on fork-contributor PRs the token is read-only, so
      the upload is skipped with a warning rather than failing the job.
    required: false
    default: 'false'
  sarif-fail-on:
    description: >-
      With `upload-sarif: true`, the minimum finding severity that fails the
      job (`low` | `medium` | `high` | `critical`). The SARIF is still produced
      and uploaded regardless. Set to `critical` to upload findings without
      gating, or `low` to gate on everything.
    required: false
    default: critical

runs:
  using: composite
  steps:
    - name: Install tt-cli
      shell: bash
      env:
        TT_REVISION: ${{ inputs.tt-version }}
      run: |
        set -euo pipefail

        # This action runs in customer CI, often next to a repository token.
        # Never install from a mutable branch/tag such as `main` or `latest`.
        # `cargo install --locked --rev <full-SHA>` gives us an immutable source
        # tree and the dependency graph committed in that tree's Cargo.lock.
        if ! [[ "$TT_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::tt-version must be an immutable 40-character TokenTrimmer commit SHA; branches, tags, and 'latest' are not accepted." >&2
          exit 2
        fi
        # Do not trust a pre-existing `tt` found on PATH. A caller can run this
        # action after arbitrary setup steps (including on a self-hosted runner),
        # so install into a private, revision-scoped directory and use that exact
        # binary in every later action step.
        install_root="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/tokentrimmer-cli-${TT_REVISION}"
        cargo install --locked --force --root "$install_root" \
          --git https://github.com/tokentrimmer/tokentrimmer \
          --rev "$TT_REVISION" tt-cli
        tt_bin="$install_root/bin/tt"
        test -x "$tt_bin"
        "$tt_bin" --version
        # Keep the exact source identity and the resulting local binary digest
        # in the job log/step environment. This is evidence for the reviewed
        # source-build distribution model, not a claim that the binary came
        # from a separately signed release archive.
        if command -v sha256sum >/dev/null 2>&1; then
          tt_bin_sha256="$(sha256sum "$tt_bin" | awk '{print $1}')"
        elif command -v shasum >/dev/null 2>&1; then
          tt_bin_sha256="$(shasum -a 256 "$tt_bin" | awk '{print $1}')"
        else
          echo "::error::no SHA-256 utility is available to record the installed tt-cli digest" >&2
          exit 1
        fi
        if ! [[ "$tt_bin_sha256" =~ ^[0-9a-fA-F]{64}$ ]]; then
          echo "::error::could not determine a SHA-256 digest for the installed tt-cli binary" >&2
          exit 1
        fi
        printf 'TokenTrimmer tt-cli source revision: %s\n' "$TT_REVISION"
        printf 'TokenTrimmer tt-cli binary SHA-256: %s\n' "$tt_bin_sha256"
        echo "TT_BIN=$tt_bin" >> "$GITHUB_ENV"
        echo "TT_CLI_REVISION=$TT_REVISION" >> "$GITHUB_ENV"
        echo "TT_CLI_SHA256=$tt_bin_sha256" >> "$GITHUB_ENV"

    - name: Run tt inspect --cost-diff
      id: run
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        BASE_REF_INPUT: ${{ inputs.base-ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        FAIL_ON_INCREASE: ${{ inputs.fail-on-cost-increase }}
        BUDGET_FILE: ${{ inputs.budget-file }}
      run: |
        set -euo pipefail

        # Resolve the base ref: explicit input wins; else the PR base SHA on
        # pull_request events; else HEAD (no-op diff).
        base="$BASE_REF_INPUT"
        if [ -z "$base" ]; then
          base="${PR_BASE_SHA:-HEAD}"
        fi
        echo "base-ref=$base" >> "$GITHUB_OUTPUT"

        report="$(mktemp -t tt-cost-diff.XXXXXX.md)"
        echo "report-file=$report" >> "$GITHUB_OUTPUT"

        # Budget gating is opt-in: pass --budget-file only when one is configured.
        budget_args=()
        if [ -n "$BUDGET_FILE" ]; then
          budget_args=(--budget-file "$BUDGET_FILE")
        fi

        # Generate the report. We DON'T use tt's exit code to gate (it is
        # non-zero on a budget violation), so capture it without aborting and
        # tell a real crash (bad base ref, git missing) from a gate-exit by the
        # presence of the report's own header — a genuine run always emits it.
        set +e
        "${TT_BIN:?tt-cli install did not export TT_BIN}" inspect "$SCAN_PATH" --cost-diff --base "$base" "${budget_args[@]}" --no-color > "$report"
        rc=$?
        set -e
        if ! grep -q "TokenTrimmer cost-diff" "$report"; then
          echo "::error::tt inspect --cost-diff failed (exit $rc) — check the base ref is fetched and git is available" >&2
          cat "$report" >&2 || true
          exit 1
        fi

        # Derive the gate from the report content: "Projected cost increase" iff
        # the net per-call cost rose; "Budget exceeded" iff a budgets.toml ceiling
        # was tripped (budgets always gate when a budget file is set).
        gate=passed
        if [ "$FAIL_ON_INCREASE" = "true" ] && grep -q "Projected cost increase" "$report"; then
          gate=failed
        fi
        if grep -q "Budget exceeded" "$report"; then
          gate=failed
        fi
        echo "cost-gate=$gate" >> "$GITHUB_OUTPUT"

        # Mirror the report into the job step summary.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Post cost-diff PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT_FILE: ${{ steps.run.outputs.report-file }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # Sticky comment: an HTML marker lets us find & update our own comment
        # instead of stacking a new one on every push.
        #
        # The PR comment is a nice-to-have, NOT the gate. Posting requires a
        # write-capable token, which is unavailable on fork-contributor PRs
        # (GITHUB_TOKEN is read-only under `on: pull_request` from a fork). A
        # denied/failed write here must never red-X the job — the cost pass/fail
        # verdict is decided independently in the "Fail the check" step below. So
        # we warn-and-continue on any failure instead of letting it propagate.
        marker="<!-- tokentrimmer-cost-gate -->"
        body="$(mktemp)"
        {
          echo "$marker"
          cat "$REPORT_FILE"
          echo ""
          echo "---"
          echo "🔍 **Verify any signed receipt** at [tokentrimmer.com/verify](https://tokentrimmer.com/verify) — paste a trace id to confirm the savings offline."
        } > "$body"

        existing="$(gh api \
          "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
          --paginate --jq \
          ".[] | select(.body | contains(\"$marker\")) | .id" 2>/dev/null | head -n1 || true)"

        if [ -n "$existing" ]; then
          posted=0
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
            -F body=@"$body" >/dev/null 2>&1 || posted=1
        else
          posted=0
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -F body=@"$body" >/dev/null 2>&1 || posted=1
        fi

        if [ "$posted" -ne 0 ]; then
          echo "::warning::TokenTrimmer cost gate could not post the PR comment (the token is likely read-only, e.g. a fork-contributor PR). The cost report is still in the job step summary and the gate verdict is unaffected."
        fi

    - name: Fail the check on cost increase or budget violation
      if: ${{ steps.run.outputs.cost-gate == 'failed' }}
      shell: bash
      run: |
        echo "::error::TokenTrimmer cost gate: a projected per-call cost increase and/or a budgets.toml violation was detected — see the cost-diff report."
        exit 1

    # ---------------------------------------------------------------------
    # Optional: SARIF static-analysis upload (opt-in via `upload-sarif: true`).
    # Independent of the cost-diff gate above.
    # ---------------------------------------------------------------------
    - name: Run tt inspect (SARIF)
      id: sarif
      if: ${{ inputs.upload-sarif == 'true' }}
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SARIF_FAIL_ON: ${{ inputs.sarif-fail-on }}
      run: |
        set -euo pipefail
        sarif_file="$(mktemp -t tt-inspect.XXXXXX.sarif)"
        echo "sarif-file=$sarif_file" >> "$GITHUB_OUTPUT"

        # Generate SARIF WITHOUT gating so a genuine setup error fails this step
        # loudly rather than being mistaken for "findings found". The findings
        # gate is applied separately in the "Fail on findings" step below, using
        # the SARIF that was uploaded. `--format sarif` prints SARIF 2.1.0 to
        # stdout; we redirect it to the file. (Stdout is clean: the CLI silences
        # its startup log line for machine-readable stdout output.)
        "${TT_BIN:?tt-cli install did not export TT_BIN}" inspect "$SCAN_PATH" --format sarif --fail-on critical > "$sarif_file"

        # Decide the findings gate from the SARIF result levels. With the
        # severity→level mapping (critical/high→error, medium→warning, low→note),
        # translate the requested fail-on into the SARIF levels that should fail.
        case "$SARIF_FAIL_ON" in
          low)      fail_levels='error warning note' ;;
          medium)   fail_levels='error warning' ;;
          high)     fail_levels='error' ;;
          critical) fail_levels='error' ;;   # critical & high both map to error
          *)        fail_levels='error' ;;
        esac

        gate=passed
        for lvl in $fail_levels; do
          if grep -q "\"level\": \"$lvl\"" "$sarif_file"; then
            gate=failed
            break
          fi
        done
        echo "findings-gate=$gate" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to Code Scanning
      id: upload-sarif
      if: ${{ inputs.upload-sarif == 'true' && steps.sarif.outputs.sarif-file != '' }}
      # A read-only token (fork-contributor PR) cannot upload SARIF. That must
      # NOT red-X the job — the findings verdict is decided independently in the
      # next step. continue-on-error downgrades an upload failure to a warning.
      continue-on-error: true
      # v3 resolved to this immutable commit on 2026-07-15. Renovate/Dependabot
      # should update the SHA with a reviewed upstream release, never a tag.
      uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
      with:
        sarif_file: ${{ steps.sarif.outputs.sarif-file }}
        category: tokentrimmer-inspect

    - name: Note when SARIF upload was skipped
      if: ${{ inputs.upload-sarif == 'true' && steps.sarif.outputs.sarif-file != '' }}
      shell: bash
      run: |
        # `upload-sarif` step uses continue-on-error, so reaching here is normal.
        # If the upload was denied (read-only token on a fork PR), surface a
        # warning so the absence of Security-tab annotations is explained.
        if [ "${{ steps.upload-sarif.outcome }}" = "failure" ]; then
          echo "::warning::TokenTrimmer Inspect could not upload SARIF (the token is likely read-only, e.g. a fork-contributor PR). The findings gate verdict is unaffected." || true
        fi
        echo "TokenTrimmer Inspect SARIF generated: ${{ steps.sarif.outputs.sarif-file }}"

    - name: Fail on findings (SARIF gate)
      if: ${{ inputs.upload-sarif == 'true' && steps.sarif.outputs.findings-gate == 'failed' }}
      shell: bash
      env:
        SARIF_FAIL_ON: ${{ inputs.sarif-fail-on }}
      run: |
        echo "::error::TokenTrimmer Inspect: findings at or above '${SARIF_FAIL_ON}' severity were detected. See the Code Scanning / Security tab for details."
        exit 1

outputs:
  cost-gate:
    description: passed or failed based on the projected per-call cost change.
    value: ${{ steps.run.outputs.cost-gate }}
  base-ref:
    description: The base git ref the working tree was diffed against.
    value: ${{ steps.run.outputs.base-ref }}
  findings-gate:
    description: >-
      With `upload-sarif: true`, `passed` or `failed` based on whether any
      finding met the `sarif-fail-on` severity. Empty when SARIF is disabled.
    value: ${{ steps.sarif.outputs.findings-gate }}
