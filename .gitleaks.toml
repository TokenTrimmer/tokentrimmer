# gitleaks config — extends the upstream default ruleset and allowlists
# findings that have been verified to be non-secrets. Used by the CI
# "secret scan" job (gitleaks binary; the org-gated gitleaks-action is not used).
title = "TokenTrimmer gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Verified non-secret fixture tokens; match only the detection"
regexTarget = "match"
regexes = [
  # Documentation and unit-test placeholders.
  '''tt_live_abc123''',
  '''tt_live_abcdefghij123456''',
  '''sk-mock-anything''',
  '''x-tokentrimmer-model-used''',
  '''a1b2c3d4e5f6a7b8c9d0a1b2c3d4e5f6''',
]

[[allowlists]]
description = "Published receipt signatures and verification keys"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^docs/receipt-spec/(arr|wfr|vcr|l2|ctdr)-v[0-9]+\.golden\.json$''',
]
regexes = [
  '''^\s*"(?:signature_hex|verifying_key_hex)"\s*:''',
]

[[allowlists]]
description = "Secret-detection rule fixtures contain only explicit fake key shapes"
condition = "AND"
regexTarget = "line"
paths = [
  '''^crates/inspect-rules-tier1/src/rules/config_agents_md_contains_secrets\.rs$''',
  '''^crates/inspect-rules-tier1/tests/rules/config-agents-md-contains-secrets/.*$''',
]
regexes = [
  '''(?:sk-proj-|sk-ant-|AKIAIOSFODNN7EXAMPLE|tt_live_abc123)''',
  '''!scan\("key: [^"]+"\)\.is_empty\(\)''',
]

[[allowlists]]
description = "Redaction unit fixtures contain only explicit fake key shapes"
condition = "AND"
regexTarget = "line"
paths = [
  '''^crates/core/src/passes/redaction\.rs$''',
]
regexes = [
  '''(?:sk-proj-|sk-ant-|AKIAIOSFODNN7EXAMPLE|tt_live_abc123)''',
]

[[allowlists]]
description = "Stripe setup scripts pass the credential only by environment reference"
targetRules = ["curl-auth-user"]
condition = "AND"
regexTarget = "match"
paths = [
  '''^scripts/setup-stripe-(?:overage|test-prices)\.sh$''',
]
regexes = [
  '''-u\s+"\$\{STRIPE_SECRET_KEY\}:"''',
]

# Vendor-SDK bridge test fixture (bridge.test.mjs): a fixed 32-hex
# placeholder token for a loopback-only MCP server URL. Verified non-secret —
# it is the same string checked into the test and asserted verbatim; a real
# credential would have to match this exact dummy value to be silenced.
[[allowlists]]
description = "Vendor-SDK bridge test fixture: fixed 32-hex placeholder token for a loopback-only MCP server URL"
targetRules = ["generic-api-key"]
regexes = [
  '''0123456789abcdef0123456789abcdef''',
]
