# gitleaks config — extends the upstream default ruleset and allowlists
# findings that have been verified to be non-secrets. Used by the CI
# "secret scan" job (gitleaks binary; the org-gated gitleaks-action is not used).
title = "TokenTrimmer gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Verified non-secrets: shell env-var refs and documented placeholders"
# Match against the whole line so an env-var reference anywhere on it counts.
regexTarget = "line"
regexes = [
  # Shell env-var interpolation, e.g. `curl -u "${STRIPE_SECRET_KEY}:"` in the
  # Stripe setup scripts — the credential is read from the environment at run
  # time, never committed.
  '''\$\{[A-Za-z_][A-Za-z0-9_]*\}''',
  # Documentation placeholder API key used in code samples.
  '''tt_live_abc123''',
  # `tt connect` unit-test fixture: an obviously-sequential fake key
  # (`tt_live_abcdefghij123456`) used to assert masking/snippet rendering.
  '''tt_live_abcdefghij123456''',
  # Benchmark harness mock-upstream placeholder: the mock accepts any bearer
  # token, so scripts/benchmarks/* send a literal `sk-mock-anything` — not a
  # real credential.
  '''sk-mock-anything''',
  # n8n node test fixtures mirror the documented x-tokentrimmer-* response
  # headers; generic-api-key false-positives on the model-id header value
  # (`claude-3-5-haiku-…`). Response-header names are never secrets.
  '''x-tokentrimmer-model-used''',
  # cache-classifier unit test uses an obviously-sequential fake hex token to
  # exercise the long-hex volatile-marker detection.
  '''a1b2c3d4e5f6a7b8c9d0a1b2c3d4e5f6''',
]
paths = [
  # Deleted product-review doc; prose ("Argon2 keys") tripped generic-api-key.
  '''PROJECT_REVIEW\.md''',
  # The secret-detection rule's own source + fixtures legitimately contain
  # fake API keys (sk-proj-…, sk-ant-…) as test data — not real secrets.
  '''crates/inspect-rules-tier1/src/rules/config_agents_md_contains_secrets\.rs''',
  '''crates/inspect-rules-tier1/tests/rules/config-agents-md-contains-secrets/.*''',
  # The in-path redaction pass: its #[cfg(test)] fixtures must contain
  # secret-shaped strings (fake sk-proj-…, emails, SSNs) to verify redaction
  # actually fires — not real secrets.
  '''crates/core/src/passes/redaction\.rs''',
]
